name: Bug report
description: Something isn't working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug. Please search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. boardwatch init ...
        2. boardwatch scan ...
        3. boardwatch top ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: boardwatch version
      description: Output of `boardwatch version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.12.3
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / traceback
      render: shell
