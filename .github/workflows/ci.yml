name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Windows runs here rather than on every push (D-151). 07:00 UTC is ~03:00 ET.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

# Superseded PR runs are cancelled; `main` pushes and the nightly are not. A PR branch that is
# pushed several times used to run every revision to completion — fix/sqlite-bound-parameter-cap
# burned four full runs (28+29+22+29 min) to land one change. Cancelling only on `pull_request`
# keeps every signal that a merge or the schedule produces, and drops only the runs whose commit
# is already superseded. Do NOT widen this to `push`: a cancelled `main` run would leave the
# branch with no completed CI for the commit that actually shipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: test (${{ matrix.python }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is OFF the per-push path (D-151): it is the slowest job by far, so it set the
        # wall clock of every push while serving no current user. It runs nightly and on demand
        # instead, which caps a Windows regression at ~24h of drift rather than the ~180 commits
        # that accumulated ~130 failures in D-145. Do NOT drop it entirely — that is the rot this
        # cadence exists to prevent, and re-greening it is expensive.
        # macOS stays on push: it is the platform boardwatch is actually run on.
        # PRs stay ubuntu-only to conserve minutes (macOS bills 10x, Windows 2x).
        os: >-
          ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
              && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]')
              || (github.event_name == 'push'
                  && fromJSON('["ubuntu-latest", "macos-latest"]')
                  || fromJSON('["ubuntu-latest"]')) }}
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      # The résumé PDF gate (P1a) shells tectonic and pdfinfo, so without these the suite does not
      # merely lose coverage — 33 tests fail. Installed on every OS in the matrix rather than
      # skipped where the binaries are missing: a skipped gate reports green while verifying
      # nothing, which is the failure mode this program exists to make impossible.
      - uses: ./.github/actions/setup-typesetting
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy --strict src tools
      # `-n auto` here and in the Makefile, deliberately NOT in pyproject's addopts: the perf job
      # below measures wall-clock timings, and inheriting workers would corrupt the numbers it
      # exists to produce. Keeping it at the call sites leaves perf, and ad-hoc narrow runs, serial.
      - run: uv run pytest -n auto

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  perf:
    name: perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest tests/perf -m perf --no-cov -s

  generalization:
    name: generalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python -m tools.generalization

  # The only job with a node toolchain, and the only one that can prove the committed React
  # bundle is what `web/` currently builds. `make check` cannot: it runs on three operating
  # systems with no node, so there it is a hash of the build inputs
  # (tests/unit/test_web_bundle_freshness.py) — which catches an un-rebuilt edit, but cannot
  # catch a bundle rebuilt from a dirty tree or a lockfile that resolves differently.
  # Linux-only and deliberately outside the Python matrix: nothing here is OS-dependent.
  web-bundle:
    name: web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the major the committed bundle is built with. rollup and esbuild are pinned by
      # web/package-lock.json, so the emitted bytes should not move with node's major — but a
      # difference here is read as "the bundle is stale", so the toolchain must not drift on its
      # own and spend that signal on noise.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # `make web` records the freshness manifest through the repo's own python.
      - run: uv sync --frozen
      - run: npm ci
        working-directory: web
      # TypeScript and eslint run here and nowhere else, for the same reason as above.
      - run: npx tsc --noEmit
        working-directory: web
      - run: npx eslint .
        working-directory: web
      # Hashed BEFORE `make web` overwrites it — Vite builds with emptyOutDir. Asset file names
      # are content-hashed, so this one listing is the asset manifest AND the per-asset content
      # hashes: a changed asset, a renamed one and a dropped one are all visible. A raw byte
      # diff of the directory would report the same failure without naming which asset moved.
      - name: Hash the committed bundle
        run: |
          cd src/boardwatch/web/static
          find . -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/committed-assets.sha256"
      - run: make web
      - name: The rebuilt bundle must match the committed one
        run: |
          cd src/boardwatch/web/static
          find . -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/rebuilt-assets.sha256"
          if ! diff -u "$RUNNER_TEMP/committed-assets.sha256" "$RUNNER_TEMP/rebuilt-assets.sha256"; then
            echo "::error::src/boardwatch/web/static/ is not what web/ builds. Run 'make web' and commit the bundle together with web/bundle-inputs.sha256."
            exit 1
          fi

  # The nightly is the ONLY build whose matrix contains Windows (D-151), and for three consecutive
  # days nothing read its result — so a deliberate CADENCE decision had quietly become an unnoticed
  # COVERAGE decision (D-211/D-212). This job is what reads it. Without a consumer, "CI is green"
  # kept meaning the 9-job push matrix, which by construction contains zero Windows jobs and can
  # never be evidence about them.
  #
  # Scoped to `schedule` on purpose: a `workflow_dispatch` run is somebody already investigating,
  # and filing an issue about a run you are watching is noise. It also CLOSES the issue when the
  # nightly recovers — an alert with no off-switch becomes a permanently-open issue everyone learns
  # to scroll past, which is the same failure as having no alert at all.
  nightly-watch:
    name: nightly-watch
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [test, gitleaks, perf, generalization, web-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- nightly-ci-watch -->';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Read the per-job conclusions from the API rather than from `needs`: `needs` collapses
            // a 3-OS matrix into one result, and WHICH os/python failed is the whole diagnostic.
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId, per_page: 100,
            });
            const failed = jobs
              .filter((job) => job.conclusion === 'failure')
              .map((job) => job.name)
              .sort();

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const open = issues.find(
              (issue) => !issue.pull_request && (issue.body || '').includes(marker),
            );

            if (failed.length === 0) {
              if (open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: open.number,
                  body: `Nightly build recovered: every job passed in ${runUrl}. Closing.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: open.number, state: 'closed',
                });
              }
              return;
            }

            const body = [
              marker,
              '## The nightly build is failing',
              '',
              `Run: ${runUrl} (commit \`${context.sha.slice(0, 7)}\`)`,
              '',
              'Failed jobs:',
              ...failed.map((name) => `- \`${name}\``),
              '',
              '**A push run cannot see this.** `ci.yml` builds the `os` matrix only for',
              '`schedule` and `workflow_dispatch` (D-151), so a push is 9 jobs with zero Windows',
              'while the nightly is 12. Reproduce on demand with',
              '`gh workflow run ci.yml --ref main` — budget ~1h05m for a Windows job.',
            ].join('\n');

            if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'Nightly CI is failing', body,
              });
            }
