se|Energy)|government|federal)\s+)?(?:security\s+)?clearance|(?:must\s+(?:currently\s+)?(?:hold|possess|have|maintain)(?:\s+and\s+maintain)?|must\s+be\s+in\s+possession\s+of|will\s+need|needs?|(?:are|is|be)\s+required\s+to\s+(?:have|hold|possess|maintain))\s+(?:an?\s+)?(?:(?:active|current)\s+)?(?:(?:U\.?S\.?\s+)?(?<!\w)(?:DoD|D\.?o\.?D\.?|DOE|Department\s+of\s+(?:Defense|Energy)|government|federal)\s+)?security\s+clearance|(?<!which\s)(?<!that\s)requires?\s+(?:(?:an?|the)\s+|(?=(?:active|current)\s))(?:active|current)\s+(?:(?:U\.?S\.?\s+)?(?<!\w)(?:DoD|D\.?o\.?D\.?|DOE|Department\s+of\s+(?:Defense|Energy)|government|federal)\s+)?(?:security\s+)?clearance(?=\s*[.;:,)]|\s*$|\s+(?:is|are|was|were|and|or|at|for|in|on|by|with|from|prior|before|upon|within|to|through)\b)|(?<!which\s)(?<!that\s)requires?\s+(?:(?:an?|the)\s+|(?=(?:active|current)\s))(?:(?:active|current)\s+)?(?:(?:U\.?S\.?\s+)?(?<!\w)(?:DoD|D\.?o\.?D\.?|DOE|Department\s+of\s+(?:Defense|Energy)|government|federal)\s+)?security\s+clearance(?=\s*[.;:,)]|\s*$|\s+(?:is|are|was|were|and|or|at|for|in|on|by|with|from|prior|before|upon|within|to|through)\b)|(?<!which\s)(?<!that\s)(?:require[sd]?|must\s+(?:hold|possess|have))(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)[^.;:]){0,40}?(?:with|w/)\s+(?:(?:an?|the)\s+|(?=(?:active|current)\s))(?:active|current)\s+(?:(?:U\.?S\.?\s+)?(?<!\w)(?:DoD|D\.?o\.?D\.?|DOE|Department\s+of\s+(?:Defense|Energy)|government|federal)\s+)?(?:security\s+)?clearance(?=\s*[.;:,)]|\s*$|\s+(?:is|are|was|were|and|or|at|for|in|on|by|with|from|prior|before|upon|within|to|through)\b)|(?<!which\s)(?<!that\s)(?:require[sd]?|must\s+(?:hold|possess|have))(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)[^.;:]){0,40}?(?:with|w/)\s+(?:(?:an?|the)\s+|(?=(?:active|current)\s))(?:(?:active|current)\s+)?(?:(?:U\.?S\.?\s+)?(?<!\w)(?:DoD|D\.?o\.?D\.?|DOE|Department\s+of\s+(?:Defense|Energy)|government|federal)\s+)?security\s+clearance(?=\s*[.;:,)]|\s*$|\s+(?:is|are|was|were|and|or|at|for|in|on|by|with|from|prior|before|upon|within|to|through)\b)|(?:^\s*|\b(?:an?|the|no)\s+)clearance(?!\s+(?:program|programs|processing|process|investigation|investigations|renewal|renewals|briefing|briefings|upgrade|upgrades|experience|work|holders?|tooling|systems?|team|teams|support|documentation|paperwork|sponsorship|reimbursement|facility|facilities|site|sites|environment|environments|office|offices|location|locations|campus|campuses)\b)(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice)\b)[^.;:]){0,40}?(?:is\s+|will\s+be\s+)?(?:required|mandatory|needed|compulsory|non[\s-]?negotiable|a\s+must(?:\s*-?\s*have)?|a\s+requirement|(?<!\bas\s)(?<!\bif\s)(?<!when\s)(?<!ever\s)(?<!where\s)(?<!unless\s)(?<!deemed\s)(?<!\bonly\s)(?:necessary|essential))|(?:must\s+(?:currently\s+)?(?:hold|possess|have|maintain)(?:\s+and\s+maintain)?|must\s+be\s+in\s+possession\s+of|will\s+need|needs?|(?:are|is|be)\s+required\s+to\s+(?:have|hold|possess|maintain))\s+(?:an?|the)\s+clearance(?!\s+(?:program|programs|processing|process|investigation|investigations|renewal|renewals|briefing|briefings|upgrade|upgrades|experience|work|holders?|tooling|systems?|team|teams|support|documentation|paperwork|sponsorship|reimbursement|facility|facilities|site|sites|environment|environments|office|offices|location|locations|campus|campuses)\b)|(?<!which\s)(?<!that\s)requires?\s+(?:an?|the)\s+clearance(?!\s+(?:program|programs|processing|process|investigation|investigations|renewal|renewals|briefing|briefings|upgrade|upgrades|experience|work|holders?|tooling|systems?|team|teams|support|documentation|paperwork|sponsorship|reimbursement|facility|facilities|site|sites|environment|environments|office|offices|location|locations|campus|campuses)\b)(?=\s*[.;:,)]|\s*$|\s+(?:is|are|was|were|and|or|at|for|in|on|by|with|from|prior|before|upon|within|to|through)\b)'
        subject_suppressors: *company_side_clearance
      - id: clearable_required
        requiredness: required
        implies: clearable_required
        scope: clause
        requirement_text: "Must be able to obtain a security clearance"
        # The OBJECT list is what makes the [active_clearance_required, clearable_required]
        # exclusive group fire, so every object a LEVELED pattern can require has to be
        # reachable here too. It was not, and the asymmetry read an OBTAINABLE clearance as a
        # HELD one (finding 44), in both directions:
        #   "Ability to obtain NATO clearance is required." -> nato_access_required alone ->
        #     a wrong `ineligible` for a candidate holding nothing yet, which is precisely what
        #     "ability to obtain" says they need not hold.
        #   "Ability to obtain a TS/SCI clearance is required." -> ZERO rows -> a wrong
        #     `eligible`, because `T\.?S\.?` could not reach `clearance` across `/SCI `.
        # Both now land on the same outcome as the wrapper that always worked ("...obtain a
        # security clearance..."): the group conflicts and the requirement resolves `uncertain`.
        # That is the honest answer, because obtain-after-hire eligibility is not a stored fact.
        # Polygraph and Public Trust are here for the same reason: "Ability to obtain a
        # polygraph is required." made a poly a HELD gate through polygraph_required.
        pattern: '(?:able|ability|eligible|eligibility|willing|willingness)\s+to\s+obtain(?:\s+and\s+maintain)?\s+(?:a\s+|an\s+)?(?:one|(?:U\.?S\.?\s+)?(?:government\s+|security\s+|T\.?S\.?\s*/\s*S\.?C\.?I\.?\s+|T\.?S\.?|Top\s+Secret\s+|Secret\s+|Confidential\s+|NATO\s+(?:Secret\s+|Confidential\s+)?|(?:D\.?O\.?E\.?\s+)?(?<!\w)Q(?!\w)\s+|(?:D\.?O\.?E\.?\s+)?(?<!\w)L(?!\w)\s+)?clearance|(?:current\s+|CI\s+|FS\s+)?poly(?:graph)?|Public\s+Trust(?:\s+determination)?|(?<!\w)S\.?A\.?P\.?(?!\w)\s+(?:program\s+)?access|S\.?C\.?I\.?(?!\w)(?:\s+access)?)|clearance[\s-]?eligible|clearable'
      # RECALL SIBLING (2026-08-30 queue audit). Eleven apply-lane postings said
      # "Eligible to obtain and maintain an active U.S. Secret security clearance" and fired
      # NO clearance row, so a candidate whose fact declares `obtainable: false` was shown a
      # defence-contractor role as blindly appliable.
      #
      # The gap is the ADJECTIVE STACK, not the verb. `clearable_required`'s object list is a
      # single OPTIONAL group, so it admits exactly one modifier: it reads `Secret clearance`
      # but not `Secret SECURITY clearance`, and not an `active`/`U.S.` adjective ahead of the
      # level. Two further holes fall out of the same shape -- `T\.?S\.?` is the one branch
      # written without a trailing `\s+`, so `a U.S. TS clearance` could not reach `clearance`
      # across the space, and `eligible FOR a clearance` has no `to obtain` to match.
      #
      # A SIBLING, not a widening of the twin. Rewriting that object list would move every
      # leveled pattern that mirrors it; this repeats the group with `*` so stacked modifiers
      # compose, and leaves the twin byte-identical.
      - id: clearable_leveled_required
        requiredness: required
        implies: clearable_required
        scope: clause
        requirement_text: "Must be able to obtain a security clearance"
        # THE HEDGE GUARD IS NEW HERE AND DELIBERATE. The twin carries no hedge suppressor,
        # which is survivable only because its reach is narrow -- measured across all three
        # live lanes, zero postings hedge a phrasing it can see. This sibling reaches wider
        # (`eligible for a ... clearance` is a common optional line), so `Willingness to
        # obtain a clearance is a plus.` would become a wrong `ineligible` without it. That is
        # the direction that silently deletes a real job, so it is guarded at the point the
        # reach is added rather than left for the twin to inherit.
        suppressed_by_unit:
          - "(?:is\\s+)?(?:a\\s+)?(?:plus|preferred|desirable|desired|bonus|advantageous)"
          - "nice[\\s-]to[\\s-]have"
          - "not\\s+(?:required|necessary|mandatory)"
        subject_suppressors: *company_side_clearance
        pattern: '(?:able|ability|eligible|eligibility|willing|willingness)\s+(?:to\s+obtain(?:\s+and\s+maintain)?|for)\s+(?:a\s+|an\s+)?(?:(?:active|current)\s+)?(?:U\.?S\.?\s+)?(?:(?:DoD|D\.?o\.?D\.?|DOE|Department\s+of\s+(?:Defense|Energy)|government|federal)\s+)?(?:(?:Top\s+Secret|Secret|Confidential|T\.?S\.?\s*/\s*S\.?C\.?I\.?|(?<!\w)T\.?S\.?(?!\w)|(?<!\w)S\.?C\.?I\.?(?!\w)|NATO|Public\s+Trust|(?:D\.?O\.?E\.?\s+)?(?<!\w)[QL](?!\w))\s+)*(?:security\s+)?clearance'

      - id: clearance_preferred
        requiredness: preferred
        implies: clearance_preferred
        scope: clause
        requirement_text: "A security clearance is preferred"
        pattern: '(?:security\s+)?clearance\s+(?:is\s+)?(?:strongly\s+|highly\s+)?(?:preferred|a\s+plus|a\s+bonus|desirable|desired|nice\s+to\s+have)|(?:preferred|desirable|ideally|bonus|desired):\s*(?:security\s+)?clearance'

  - id: degree
    label: Degree
    tier: profile
    fact: highest_degree
    answer_type: choice
    default_policy: preference
    question: "What is the highest degree you have completed?"
    fields:
      - name: highest_degree
        type: choice
        choices: [none, associate, bachelor, master, doctorate, prefer_not_to_say]
        ranks: {none: 0, associate: 2, bachelor: 3, master: 4, doctorate: 5}
    implies_vocabulary:
      - degree_required
      - degree_required_with_field
      - degree_required_or_equivalent
      - degree_preferred
      - degree_preferred_or_equivalent
    exclusive_groups:
      - [degree_required, degree_required_with_field, degree_required_or_equivalent]
    # THE FIELD-OF-STUDY CATALOG. Versioned DATA, never a Python vocabulary: a field-of-study
    # taxonomy is exactly the thing job-apps found did not port when a second user appeared, so
    # the ids, the JD surface forms that NAME each id, and the reviewed relatedness partition
    # all live here and are overridable per user via {config_dir}/rules.yaml.
    # An id is what the PROFILE stores; the surfaces are the JD side only. A value outside this
    # list -- typed by a user or written by a posting -- is a FAILURE, never a new bucket: the
    # resolver abstains on it rather than inventing a field.
    # SHORT FORMS ARE DELIBERATELY SCARCE. Surfaces are matched case-insensitively inside a
    # captured phrase, so a two-letter form that is also an English word matches prose: `IT`
    # would fire on "a field related to it" and `IS` on any copula. `CS` and `EE` are here
    # because neither is an English word; no other abbreviation earns its risk.
    fields_of_study:
      - id: computer_science
        surfaces:
          - "computer\\s+sciences?"
          - "(?<!\\w)C\\.?S\\.?(?!\\w)"
      - id: computer_engineering
        surfaces: ["computer\\s+engineering"]
      - id: software_engineering
        surfaces: ["software\\s+engineering", "software\\s+development"]
      - id: information_technology
        surfaces: ["information\\s+technology"]
      - id: information_systems
        surfaces: ["(?:management\\s+)?information\\s+systems"]
      - id: data_science
        surfaces: ["data\\s+science", "data\\s+analytics"]
      - id: electrical_engineering
        surfaces:
          - "electrical\\s+(?:and\\s+electronics?\\s+)?engineering"
          - "(?<!\\w)E\\.?E\\.?(?!\\w)"
      - id: mechanical_engineering
        surfaces: ["mechanical\\s+engineering"]
      - id: civil_engineering
        surfaces: ["civil\\s+engineering"]
      - id: chemical_engineering
        surfaces: ["chemical\\s+engineering"]
      - id: industrial_engineering
        surfaces: ["industrial\\s+engineering"]
      - id: aerospace_engineering
        surfaces: ["aero(?:space|nautical)\\s+engineering"]
      - id: mathematics
        surfaces: ["math(?:ematic)?s(?!\\w)", "mathematical\\s+sciences?"]
      - id: statistics
        surfaces: ["(?:bio)?statistics"]
      - id: physics
        surfaces: ["physics"]
      - id: economics
        surfaces: ["econom(?:ics|etrics)"]
      - id: business_administration
        surfaces: ["business(?:\\s+(?:administration|management))?"]
      - id: finance
        surfaces: ["finance", "financial\\s+engineering"]
      - id: accounting
        surfaces: ["accounting", "accountancy"]
      - id: marketing
        surfaces: ["marketing"]
      - id: biology
        surfaces: ["biology", "biological\\s+sciences?", "biochemistry"]
      - id: chemistry
        surfaces: ["chemistry"]
      - id: nursing
        surfaces: ["nursing"]
      - id: psychology
        surfaces: ["psychology"]
      - id: sociology
        surfaces: ["sociology"]
      - id: political_science
        surfaces: ["political\\s+science", "public\\s+(?:policy|administration)"]
      - id: communications
        surfaces: ["communications?(?!\\s+protocols?)", "journalism"]
      - id: graphic_design
        surfaces: ["graphic\\s+design", "visual\\s+(?:design|communications?)"]
      - id: human_computer_interaction
        surfaces: ["human[\\s-]computer\\s+interaction", "(?:interaction|product)\\s+design"]
      - id: law
        surfaces: ["(?<!\\w)law(?!\\w)", "juris\\s+doctor"]
      - id: education
        # `education` is also the MASS NOUN of equivalence and accreditation boilerplate --
        # "an equivalent combination of education and experience", "or foreign education
        # equivalent", "Accreditation Commission for Education" -- and reading those as the
        # named FIELD decided `ineligible` on postings that named no field at all. The
        # boilerplate frames are rejected by the word immediately before the noun; the field
        # sense heads its own phrase ("Education", "Higher Education", "Special Education",
        # or after a comma in a list) and never takes one of them. `educational` is never the
        # field sense either, so the surface is whole-word.
        surfaces:
          - "(?<!\\bof\\s)(?<!\\bfor\\s)(?<!\\bin\\s)(?<!\\bformal\\s)(?<!\\bforeign\\s)(?<!\\bmilitary\\s)(?<!\\bnursing\\s)education(?!\\w)"
    # A REVIEWED PARTITION, not a similarity score. Membership is a statement that a hiring
    # process treats these fields as interchangeable, and it is only ever consulted when the
    # POSTING itself says it will take a neighbour (see related_field_escapes). Disjoint by
    # construction, so relatedness can never depend on which group is read first. A field in
    # no group is related to nothing but itself, which is the safe default for a new entry.
    related_fields_of_study:
      - [computer_science, computer_engineering, software_engineering, information_technology,
         information_systems, data_science, electrical_engineering,
         human_computer_interaction]
      - [mechanical_engineering, civil_engineering, chemical_engineering,
         industrial_engineering, aerospace_engineering]
      - [mathematics, statistics, physics]
      - [business_administration, finance, accounting, marketing, economics]
      - [biology, chemistry, nursing]
      - [psychology, sociology, political_science, communications]
    # How a posting says the fields it named are NOT the only acceptable ones. Without one of
    # these the posting has named a SPECIFIC field, and answering `met` to it with a merely
    # related degree is the wrong clear this whole family exists to avoid -- so an escape is
    # required for the related-field MET, and its presence is also what turns an otherwise
    # decidable `unmet` into an abstain (the posting has said relatedness it did not enumerate
    # may qualify). `or equivalent` is deliberately absent: it is already in degree_equivalence,
    # which abstains the whole row document-wide before a resolver ever sees it.
    related_field_escapes:
      # "or a related field", "or a similar discipline", and the qualified forms. The adjective
      # slot is ONE GENERIC WORD rather than an enumeration: an enumerated list read "or a
      # related healthcare field" as a closed requirement and decided `unmet` where the posting
      # had plainly opened it, and the list would need a new token per industry forever.
      # The article slot carries `other`/`another` as well as `a`/`an`: "or another related
      # field" is the same escape, and `an?\s+` cannot consume either of them, so the escape
      # went unseen and the row decided `unmet`.
      - "or\\s+(?:(?:an?|(?:an)?other)\\s+)?(?:closely\\s+|highly\\s+)?(?:related|similar|relevant|comparable|allied|adjacent)\\s+(?:\\w+\\s+)?(?:field|discipline|area|major|subject|degree|program|stud(?:y|ies))s?"
      # "or a STEM field" -- an open CATEGORY named instead of the word `related`.
      - "or\\s+(?:an?\\s+)?(?:STEM|technical|quantitative|scientific|engineering|numerate|business|healthcare)\\s+(?:field|discipline|area|major|subject|degree)s?"
      # "a quantitative field such as Statistics or Physics": the enumeration is EXEMPLARY, so
      # reading it as closed decided `ineligible` against a list the posting called examples.
      - "(?:such\\s+as|including|e\\.?g\\.?)(?!\\w)"
    # THE CANONICAL REQUIREMENT-MARKER VOCABULARY, declared once here and written out verbatim
    # on each of the SEVEN marker-carrying patterns below. Findings 115-124 closed this as a
    # class after finding 102 closed one token of it by hand; parity.py measured ELEVEN missing
    # markers on the degree rows against the sibling families that carried them.
    #   marker-LAST, which the optional copula makes one arm for both the bare and copular
    #     forms ("Degree necessary." / "A degree is necessary."):
    #       (?:is\s+)?(?:required|mandatory|necessary|essential|compulsory|needed
    #                   |a\s+must|a\s+requirement|non-negotiable)(?!\w)
    #   marker-FIRST, the verb phrase before the subject:
    #       (?:require[sd]?(?:\s+to\s+(?:have|hold|possess))?
    #          |must\s+(?:have|hold|possess|be)|(?:will\s+)?needs?)
    # The `(?!\w)` tail is load-bearing, not decoration: without it `essential` matches inside
    # `essentially` and `necessary` inside `necessarily`, so "A degree is essentially a filter."
    # read as a hard requirement. The `\s+to\s+(?:have|hold|possess)` bridge exists because
    # `require[sd]?` alone reached the LEVELED patterns through their bounded `{0,20}` gap while
    # any_degree_required and the three in-field patterns have no gap and were stranded on
    # "You are required to have a degree."
    # WHY IT IS REPEATED rather than aliased: a YAML anchor substitutes a whole NODE and
    # `pattern:` is one scalar, so an alias cannot reach inside a regex, and the loader does no
    # interpolation (`re.compile(p["pattern"])`, verbatim). Same situation as the jurisdiction
    # list, which is likewise written out twice in the sponsorship patterns. Drift is caught
    # behaviourally, not by this comment: every token is pinned at every level in matrix.py, so
    # dropping one from a single pattern fails a case.
    # The other six patterns carry NO marker by design. The three *_or_equivalent patterns key
    # on the equivalence escape and the three preferred patterns key on the hedge, so there is
    # nothing here for them to lack.
    patterns:
      - id: doctorate_required
        requiredness: required
        implies: degree_required
        scope: sentence
        required_rank: 5
        requirement_text: "A doctorate is required"
        pattern: '(?:(?P<coord_rank4_a>Master[''’‘]?s?|(?<![\w.])M\.?S\.?(?!\w)|(?<![\w.])M\.?Sc\.?(?!\w)|(?<![\w.])M\.?Eng\.?(?!\w)|(?<![\w.])M\.?B\.?A\.?(?!\w))\s*(?:degree)?\s*(?:,\s*)?(?:or|/)\s*)?(?:Ph\.?D\.?|Doctorate|Doctoral\s+degree|Doctor\s+of\s+(?:Philosophy|Science|Engineering))(?:\s*(?:,\s*)?(?:or|/)\s*(?P<coord_rank4_b>Master[''’‘]?s?|(?<![\w.])M\.?S\.?(?!\w)|(?<![\w.])M\.?Sc\.?(?!\w)|(?<![\w.])M\.?Eng\.?(?!\w)|(?<![\w.])M\.?B\.?A\.?(?!\w))\s*(?:degree)?)?\s*(?:degree\s*)?(?:is\s+)?(?:required|mandatory|necessary|essential|compulsory|needed|a\s+must|a\s+requirement|non-negotiable)(?!\w)|(?:require[sd]?(?:\s+to\s+(?:have|hold|possess))?|must\s+(?:have|hold|possess|be)|(?:will\s+)?needs?|(?<!\w)mandator(?:y|ily)(?!\w))\s*:?\s*(?:at\s+least\s+|a\s+minimum\s+of\s+)?(?:(?:an?\s+)?(?P<coord_rank4_c>Master[''’‘]?s?|(?<![\w.])M\.?S\.?(?!\w)|(?<![\w.])M\.?Sc\.?(?!\w)|(?<![\w.])M\.?Eng\.?(?!\w)|(?<![\w.])M\.?B\.?A\.?(?!\w))\s*(?:degree)?\s*(?:,\s*)?(?:or|/)\s*)?(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)[^.]){0,20}(?:Ph\.?D\.?|Doctorate|Doctoral\s+degree|Doctor\s+of\s+(?:Philosophy|Science|Engineering))(?:\s*(?:,\s*)?(?:or|/)\s*(?P<coord_rank4_d>Master[''’‘]?s?|(?<![\w.])M\.?S\.?(?!\w)|(?<![\w.])M\.?Sc\.?(?!\w)|(?<![\w.])M\.?Eng\.?(?!\w)|(?<![\w.])M\.?B\.?A\.?(?!\w)))?(?![\w-])'
        # THREE ROLES were conflated in one document-scoped suppressed_by list here and on every
        # other plain degree pattern, which is findings 38 and 52. They are separated by role:
        #   an EQUIVALENCE ESCAPE is inherently cross-sentence ("A Master's degree is required.
        #     Equivalent experience may be substituted.") so it stays DOCUMENT-scoped, but it
