version: 1

career_fields: [software]

# Cues that flip a clause's polarity. A detection is DROPPED when a cue occurs in its
# unit OUTSIDE the matched span; a pattern that consumes its own negation survives.
# Contractions are spelled out one by one on purpose. A single "n't" cue is UNREACHABLE:
# the boundary test is (?<!\w)cue(?!\w), and the character before the "n" of a contraction
# is always a word character, so "n't" never matched and "An active Secret clearance isn't
# required." resolved to a wrong `unmet`. Polarity vocabulary belongs in the catalog, so the
# fix is a longer list here rather than a special case in the matcher.
negation_cues:
  - "not"
  - "cannot"
  - "can't"
  - "don't"
  - "doesn't"
  - "didn't"
  - "won't"
  - "isn't"
  - "aren't"
  - "wasn't"
  - "weren't"
  - "shouldn't"
  - "wouldn't"
  - "couldn't"
  - "haven't"
  - "hasn't"
  - "needn't"
  - "no"
  - "never"
  - "without"
  - "neither"
  - "nor"
  - "except"
  - "unless"
  - "rather than"
  - "instead of"

# Fixed idioms in which one of the cues above is NOT polarity. A cue occurrence lying wholly
# inside one of these is invisible to BOTH cue searches, so detection proceeds exactly as if
# the words were absent. This is not a suppressor and not a hedge: it cancels nothing, it
# declares that the surface form was never a negation in the first place.
# "unless otherwise noted" is boilerplate meaning "except where this posting states a different
# value". It qualifies the DOCUMENT, not the requirement it trails. Read as polarity,
# "6 years of experience is required unless otherwise noted." dropped the floor and returned
# `eligible` to a 3-year candidate, in all three of the experience, degree and clearance
# families. That is residual 49a.
# Why an IDIOM and not a clause bound: the LEADING form "Unless otherwise noted, 6 years of
# experience is required." was already correct, because the comma is a clause boundary. Only
# the TRAILING form has no delimiter for _clause_bounds to find. An idiom is what covers both.
# Deliberately NARROW. `unless otherwise agreed` is a REAL escape, not boilerplate, and an
# earlier draft that included it swallowed "...unless otherwise agreed with the hiring
# manager." That was measured, not reasoned about, and it is why this list names participles
# of "state" and nothing else.
negation_cue_idioms:
  - "unless\\s+otherwise\\s+(?:noted|specified|stated|indicated|mentioned)"
  # FINDING 64. "...authorized to work in the US WITHOUT sponsorship." is the commonest
  # sponsorship-blocking sentence on US postings, and `without` STRENGTHENS the gate. Read
  # as polarity it deleted the gate it belongs to and returned `eligible` with ZERO rows.
  # Narrow on purpose, the same way the boilerplate idiom above is: the cue only loses its
  # polarity when its object is SPONSORSHIP. "We will consider candidates without 5 years
  # of experience." keeps its cue because `experience` is not in this list, and that case
  # is a permanent control. The `with no need for` twin is the same idiom with the `no`
  # cue instead of `without`, and it was measured failing the same way.
  - "without\\s+(?:(?:the|a|any)\\s+need\\s+(?:for|of)\\s+|requiring\\s+|needing\\s+|current\\s+or\\s+future\\s+)?(?:employer\\s+|company\\s+|visa\\s+|work\\s+visa\\s+|immigration\\s+|employment[\\s-]+based\\s+visa\\s+)?sponsorship"
  - "with\\s+no\\s+(?:need\\s+(?:for|of)\\s+)?(?:employer\\s+|company\\s+|visa\\s+)?sponsorship"
  # A COMPARATIVE FLOOR, not a negation. "no less than 5 years" and "not fewer than 5 years"
  # state the same bar as "at least 5 years", but the bare `no`/`not` cue sat outside the
  # matched span and DROPPED the detection, so the posting carried no experience row at all
  # and landed `uncertain` -- which routes to the apply lane as blindly-appliable. Measured
  # against a one-year profile: "at least 5 years" resolved `ineligible`, all four comparative
  # forms resolved `uncertain` with ZERO rows.
  # Narrow on purpose, like the two idioms above: only the fixed comparative `(no|not) (less|
  # fewer) than` loses its polarity. "We will consider candidates without 5 years of
  # experience." keeps its cue -- `without` is not in this idiom and that case is the control.
  - "(?:no|not)\\s+(?:less|fewer)\\s+than"

families:
  - id: work_auth
    label: Work authorization
    tier: profile
    fact: work_authorization
    answer_type: structured
    # D-035: work_auth is the sole family whose SHIPPED default is `blocker`, not
    # `preference`. It is the canonical hard stop (B7), the most-developed family, and
    # keystone-gated (resolve.py aborts to UNKNOWN, never `unmet`, when the fact is absent),
    # so flipping only this assignment is what makes a fresh multi-tenant profile return a
    # decisive `ineligible` on a genuine work-auth stop instead of 0 ineligible ever. The
    # other five families stay `preference`: they are false-skip-risky and remain opt-in.
    default_policy: blocker
    question: "Which best describes your work authorization for the roles you are targeting?"
    fields:
      - name: status
        type: choice
        choices: [citizen, permanent_resident, ead_or_similar, needs_sponsorship, prefer_not_to_say]
      - name: jurisdiction
        type: choice
        choices: [us, ca, uk, eu, other, unspecified]
      # P2a: orthogonal to `status`. Declaring this explicitly is what lets an
      # ead_or_similar holder be DECIDED against a sponsorship restriction instead of
      # forced to abstain; left unset, the resolver falls back to `status` alone.
      - name: needs_sponsorship
        type: bool
    implies_vocabulary:
      - authorization_required
      - citizenship_required
      - citizen_or_lpr_required
      - sponsorship_unavailable
      - sponsorship_available
    exclusive_groups:
      # A GENUINE mutual exclusion: one posting cannot both offer and refuse sponsorship, the
      # two values carry no order, and neither refines the other -- so co-occurrence really is
      # a contradiction and dissolving both rows is right.
      #
      # [citizenship_required, citizen_or_lpr_required, authorization_required] WAS a second
      # group here and was REMOVED on 2026-08-31 (D-388). Those three are a STRENGTH LADDER,
      # not a mutual exclusion: citizenship is strictly stronger than citizen-or-LPR, which is
      # strictly stronger than authorization. A posting stating two of them REFINES itself.
      # Grouping them meant "Applicants must be authorized to work in the United States."
      # beside "A natural-born U.S. citizen is required." rewrote BOTH rows to `unknown` and
      # discarded a decisive `unmet`, so a non-citizen read `uncertain` on a posting that
      # plainly excludes them -- and a CITIZEN, who satisfies both arms, read `uncertain` too,
      # an abstain no fact could ever resolve. With the group gone the roll-up decides both
      # directions directly. Corpus-verified at 0 mismatches over all 1034 cases.
      #
      # `experience_years` has a refinement group deliberately: those three are PARALLEL BARS,
      # where clearing a total bar while missing a skill-scoped one is genuinely ambiguous
      # rather than a refinement. `clearance` keeps its group deliberately too -- clearable_required
      # is a DISJUNCTION ("hold one, or be able to obtain one"), an escape hatch rather than a
      # weaker rung, which is why seven corpus cases assert that pair abstains.
      - [sponsorship_unavailable, sponsorship_available]
    # ONE CANONICAL MARKER VOCABULARY PER POSITION, findings 125-139. All six requirement
    # patterns below carry these two groups BYTE-IDENTICALLY, so a marker token can no longer
    # be present on one sibling and absent on another. That asymmetry is the shape behind
    # findings 66, 68, 69, 84, 88, 89, 102 and 103, every one of which was found by hand one
    # token at a time; the parity table collapsed sixteen work_auth rows into these two edits.
    #
    #   marker FIRST  (?:must\s+(?:be|have|hold|possess)|require[sd]?|
    #                    (?:will\s+)?needs?(?:\s+to\s+(?:be|have|hold|possess))?|
    #                    proof\s+of|able\s+to\s+(?:provide|show))
    #   marker LAST   \s*(?:STOP-GUARDED WORD GAP){0,3}?(?:required|mandatory|necessary|
    #                    essential|compulsory|needed|non-?negotiable|a\s+must|a\s+requirement)
    #
    # NOT a YAML anchor, and that is a limitation rather than a style choice: an alias
    # substitutes a whole NODE, while these groups are SUBSTRINGS of a longer scalar that
    # proto.load compiles verbatim. Byte-identical text is the only sharing the loader allows,
    # so the parity of the six is asserted behaviourally instead of structurally.
    #
    # WHY marker-LAST IS A GAP AND NOT A FIXED (?:is\s+)? COPULA. The gap is what makes a
    # NEGATION a measurable drop. `Authorization to work in the US is not required.` used to
    # produce zero rows with an EMPTY drop list, so the pattern never matched and the cue guard
    # never ran; the absence proved nothing, which is finding 91's vacuity class. Now the arm
    # matches across the cue and detect() drops it as cue-inside:not, which a case can assert.
    # The gap crosses \x27 as well as \w for the same reason one level down: `isn\x27t required`
    # is undetectable to a \w-only gap, and negation_cues spells out every contraction
    # precisely because that surface returned a wrong verdict once already.
    #
    # THE STOP GUARD IS LOAD-BEARING. `preferred`, `desirable`, `a plus`, `nice` and `but` are
    # unreachable through the gap, so `Authorization to work in the US is preferred.` and
    # `... is helpful but not required.` stay at zero rows. Measured, both directions.
    #
    # EVERY ABBREVIATION ATOM CARRIES (?<!\w). Without it `CAMPUS work authorization is
    # required.` and `SPUK work authorization is required.` returned a wrong `ineligible`,
    # measured against the pre-wave catalog. The family's single lint3 probe passed only
    # because its phrasing needed a marker gap the narrow vocabulary did not have, so the
    # probe was defending the missing guard rather than proving it existed.
    patterns:
      - id: us_authorization_required
        requiredness: required
        implies: authorization_required
        jurisdiction: us
        scope: sentence
        requirement_text: "Must be authorized to work in the United States"
        pattern: '(?:must\s+(?:be|have|hold|possess)|require[sd]?|(?:will\s+)?needs?(?:\s+to\s+(?:be|have|hold|possess))?|proof\s+of|able\s+to\s+(?:provide|show))\s+(?:(?:an?\s+)?(?:(?<!\w)U\.?S\.?A?\.?|United\s+States|American)\s+citizens?\s*,?\s*or\s+(?:otherwise\s+)?)?(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)\w+\s+){0,3}?(?:(?:legally\s+)?(?:authori[sz]ed|eligible)\s+to\s+work\s+in\s+(?:the\s+)?(?:(?<!\w)U\.?S\.?A?\.?|United\s+States)|(?:the\s+)?(?:right|authori[sz]ation)\s+to\s+work\s+in\s+(?:the\s+)?(?:(?<!\w)U\.?S\.?A?\.?|United\s+States)|(?:(?<!\w)U\.?S\.?A?\.?|United\s+States)\s+work\s+authori[sz]ation)|(?:(?:legally\s+)?(?:authori[sz]ed|eligible)\s+to\s+work\s+in\s+(?:the\s+)?(?:(?<!\w)U\.?S\.?A?\.?|United\s+States)|(?:the\s+)?(?:right|authori[sz]ation)\s+to\s+work\s+in\s+(?:the\s+)?(?:(?<!\w)U\.?S\.?A?\.?|United\s+States)|(?:(?<!\w)U\.?S\.?A?\.?|United\s+States)\s+work\s+authori[sz]ation)\s*(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)[\w\x27]+\s+){0,3}?(?:required|mandatory|necessary|essential|compulsory|needed|non-?negotiable|a\s+must|a\s+requirement)'
      - id: uk_authorization_required
        requiredness: required
        implies: authorization_required
        jurisdiction: uk
        scope: sentence
        requirement_text: "Must have the right to work in the United Kingdom"
        pattern: '(?:must\s+(?:be|have|hold|possess)|require[sd]?|(?:will\s+)?needs?(?:\s+to\s+(?:be|have|hold|possess))?|proof\s+of|able\s+to\s+(?:provide|show))\s+(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)\w+\s+){0,3}?(?:(?:legally\s+)?(?:authori[sz]ed|eligible)\s+to\s+work\s+in\s+(?:the\s+)?(?:(?<!\w)U\.?K\.?|United\s+Kingdom)|(?:the\s+)?(?:right|authori[sz]ation)\s+to\s+work\s+in\s+(?:the\s+)?(?:(?<!\w)U\.?K\.?|United\s+Kingdom)|(?:(?<!\w)U\.?K\.?|United\s+Kingdom)\s+work\s+authori[sz]ation)|(?:(?:legally\s+)?(?:authori[sz]ed|eligible)\s+to\s+work\s+in\s+(?:the\s+)?(?:(?<!\w)U\.?K\.?|United\s+Kingdom)|(?:the\s+)?(?:right|authori[sz]ation)\s+to\s+work\s+in\s+(?:the\s+)?(?:(?<!\w)U\.?K\.?|United\s+Kingdom)|(?:(?<!\w)U\.?K\.?|United\s+Kingdom)\s+work\s+authori[sz]ation)\s*(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)[\w\x27]+\s+){0,3}?(?:required|mandatory|necessary|essential|compulsory|needed|non-?negotiable|a\s+must|a\s+requirement)'
      - id: eu_authorization_required
        requiredness: required
        implies: authorization_required
        jurisdiction: eu
        scope: sentence
        requirement_text: "Must have the right to work in the EU"
        pattern: '(?:must\s+(?:be|have|hold|possess)|require[sd]?|(?:will\s+)?needs?(?:\s+to\s+(?:be|have|hold|possess))?|proof\s+of|able\s+to\s+(?:provide|show))\s+(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)\w+\s+){0,3}?(?:(?:legally\s+)?(?:authori[sz]ed|eligible)\s+to\s+work\s+in\s+(?:the\s+)?(?:(?<!\w)E\.?U\.?|European\s+Union)|(?:the\s+)?(?:right|authori[sz]ation)\s+to\s+work\s+in\s+(?:the\s+)?(?:(?<!\w)E\.?U\.?|European\s+Union)|(?:(?<!\w)E\.?U\.?|European\s+Union)\s+work\s+authori[sz]ation)|(?:(?:legally\s+)?(?:authori[sz]ed|eligible)\s+to\s+work\s+in\s+(?:the\s+)?(?:(?<!\w)E\.?U\.?|European\s+Union)|(?:the\s+)?(?:right|authori[sz]ation)\s+to\s+work\s+in\s+(?:the\s+)?(?:(?<!\w)E\.?U\.?|European\s+Union)|(?:(?<!\w)E\.?U\.?|European\s+Union)\s+work\s+authori[sz]ation)\s*(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)[\w\x27]+\s+){0,3}?(?:required|mandatory|necessary|essential|compulsory|needed|non-?negotiable|a\s+must|a\s+requirement)'
      - id: ca_authorization_required
        requiredness: required
        implies: authorization_required
        jurisdiction: ca
        scope: sentence
        requirement_text: "Must be authorized to work in Canada"
        pattern: '(?:must\s+(?:be|have|hold|possess)|require[sd]?|(?:will\s+)?needs?(?:\s+to\s+(?:be|have|hold|possess))?|proof\s+of|able\s+to\s+(?:provide|show))\s+(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)\w+\s+){0,3}?(?:(?:legally\s+)?(?:authori[sz]ed|eligible)\s+to\s+work\s+in\s+Canada|(?:the\s+)?(?:right|authori[sz]ation)\s+to\s+work\s+in\s+Canada|Canadian\s+work\s+authori[sz]ation)|(?:(?:legally\s+)?(?:authori[sz]ed|eligible)\s+to\s+work\s+in\s+Canada|(?:the\s+)?(?:right|authori[sz]ation)\s+to\s+work\s+in\s+Canada|Canadian\s+work\s+authori[sz]ation)\s*(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)[\w\x27]+\s+){0,3}?(?:required|mandatory|necessary|essential|compulsory|needed|non-?negotiable|a\s+must|a\s+requirement)'
      - id: us_citizen_or_lpr_required
        requiredness: required
        implies: citizen_or_lpr_required
        jurisdiction: us
        scope: sentence
        requirement_text: "Must be a US citizen or lawful permanent resident"
        # A bare COMMA is a connector too: "Open to US citizens, permanent residents, and
        # green card holders." is an enumeration with no conjunction after `citizens`.
        # Requirement MARKER, mandatory. Without one the bare-comma connector added for the
        # enumeration form matched descriptive prose: "Our workforce includes US citizens,
        # permanent residents, and visa holders from 30 countries." resolved `ineligible`.
        pattern: '(?:(?:must\s+(?:be|have|hold|possess)|require[sd]?|(?:will\s+)?needs?(?:\s+to\s+(?:be|have|hold|possess))?|proof\s+of|able\s+to\s+(?:provide|show))|open\s+to|limited\s+to|restricted\s+to|only|eligible\s+applicants\s+are)\s+(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)\w+\s+){0,3}?(?:an?\s+)?(?:(?<!\w)U\.?S\.?|United\s+States|American)\s+citizens?(?:hip)?(?:\s*,\s*(?:(?:and\s*/\s*or|or|and|/)\s*)?|\s*(?:and\s*/\s*or|or|and|/)\s*)(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)\w+\s+){0,3}?(?:lawful\s+)?(?:permanent\s+residen(?:ts?|ce|cy)|green\s*cards?(?:\s+holders?)?|(?<!\w)L\.?P\.?R\.?s?)|(?:(?<!\w)U\.?S\.?|United\s+States|American)\s+citizens?(?:hip)?\s*(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)[\w\x27]+\s+){0,3}?(?:required|mandatory|necessary|essential|compulsory|needed|non-?negotiable|a\s+must|a\s+requirement)\s*,?\s*(?:and\s*/\s*or|or|and|/)\s*(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)\w+\s+){0,3}?(?:lawful\s+)?(?:permanent\s+residen(?:ts?|ce|cy)|green\s*cards?(?:\s+holders?)?|(?<!\w)L\.?P\.?R\.?s?)|(?:(?<!\w)U\.?S\.?|United\s+States|American)\s+citizens?(?:hip)?(?:\s*,\s*(?:(?:and\s*/\s*or|or|and|/)\s*)?|\s*(?:and\s*/\s*or|or|and|/)\s*)(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)\w+\s+){0,3}?(?:lawful\s+)?(?:permanent\s+residen(?:ts?|ce|cy)|green\s*cards?(?:\s+holders?)?|(?<!\w)L\.?P\.?R\.?s?)\s*(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)[\w\x27]+\s+){0,3}?(?:required|mandatory|necessary|essential|compulsory|needed|non-?negotiable|a\s+must|a\s+requirement)'
      - id: us_citizen_required
        requiredness: required
        implies: citizenship_required
        jurisdiction: us
        # Sentence scope: the clause splitter cuts the comma in "Must be a US citizen, or a
        # lawful permanent resident.", which is why the LPR alternative was unreachable.
        scope: sentence
        requirement_text: "Must be a US citizen"
        # FINDING 39. This escape is SENTENCE-scoped: not document-scoped, and not clause-scoped.
        # Document-scoped, "Applicants must be US citizens. We also employ contractors or
        # permanent residents in other roles." dropped the gate and returned `eligible` with
        # ZERO rows to a non-citizen. Clause-scoped it is inert, because in "Must be a US
        # citizen, or a lawful permanent resident." the escape sits after the comma, in a
        # different clause from the span it must stand down.
        # The cost is named rather than hidden: narrowing a suppressor turns drops back into
        # rows, so a genuine cross-sentence waiver ("Green card holders will also be
        # considered.") now reads as a wrong `ineligible` for an LPR. Two wrong `eligible` on a
        # citizenship gate removed for one wrong `ineligible` introduced, which is the right
        # trade in this project's severity order. The document-scoped form never covered
        # cross-sentence waivers reliably anyway: it needs a literal adjacent `or`.
        suppressed_by_sentence:
          - "(?:\\s*,\\s*(?:(?:and\\s*/\\s*or|or|and|/)\\s*)?|\\s*(?:and\\s*/\\s*or|or|and|/)\\s*)(?:\\w+\\s+){0,3}?(?:permanent\\s+residen|green\\s*card|lawful|L\\.?P\\.?R\\.?)"
          - "or\\s+(?:otherwise\\s+)?(?:legally\\s+)?(?:authori[sz]ed|eligible|permitted)\\s+to\\s+work"
        pattern: '(?:(?:must\s+(?:be|have|hold|possess)|require[sd]?|(?:will\s+)?needs?(?:\s+to\s+(?:be|have|hold|possess))?|proof\s+of|able\s+to\s+(?:provide|show))|open\s+to|limited\s+to|restricted\s+to|only|eligible\s+applicants\s+are)\s+(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)\w+\s+){0,3}?(?:an?\s+){0,1}(?:(?<!\w)U\.?S\.?|United\s+States|American)\s+citizens?(?:hip)?|(?:(?<!\w)U\.?S\.?|United\s+States|American)\s+citizens?(?:hip)?\s*(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)[\w\x27]+\s+){0,3}?(?:required|mandatory|necessary|essential|compulsory|needed|non-?negotiable|a\s+must|a\s+requirement)'
      # THREE RECALL PATTERNS for citizenship idioms that produced ZERO rows across the live
      # apply lane, all four causes diagnosed before any of them was written (the F64 lesson:
      # a pattern written against a guessed cause guards a case it cannot see). The resolver
      # was NOT the problem -- `Must be a US citizen.` already decides `unmet` for
      # ead_or_similar per D-322. Every miss was DETECTION.
      #
      # WHY NOT WIDEN THE THREE PATTERNS ABOVE. Each miss breaks a different structural
      # assumption of the shared marker vocabulary, and widening the word gap enough to reach
      # any of them re-opens the descriptive-prose false positives that the stop guard and the
      # mandatory marker exist to close. Narrow siblings keep the parity table intact.
      - id: us_person_export_control_required
        requiredness: required
        # ITAR/EAR "US person" admits citizens, LPRs AND protected individuals, so this is the
        # citizen-OR-LPR surface, not the citizen-only one. It still decides `unmet` for
        # ead_or_similar with needs_sponsorship -- a refugee or asylee EAD holder would not
        # need sponsorship, so the two facts together exclude the protected-individual arm.
        implies: citizen_or_lpr_required
        jurisdiction: us
        scope: sentence
        requirement_text: "Must be a US person under export-control regulations"
        # The export-control CONTEXT is mandatory, not decoration: it is what separates this
        # from descriptive prose naming citizens. Both orders occur in the wild, hence the
        # two arms. `(i)`/`(1)`/`a.` enumerators are why the shared 0-3 word gap could never
        # reach the noun -- `\w+` does not cross a parenthesis - so the gap here is `.{0,N}`
        # bounded by the sentence scope rather than a word run.
        pattern: '(?:(?:export\s+(?:control|regulation|administration)s?|(?<!\w)I\.?T\.?A\.?R\.?(?!\w)|(?<!\w)E\.?A\.?R\.?(?!\w))[^\n]{0,200}?(?:must\s+be|shall\s+be|required\s+to\s+be|restricted\s+to)[^\n]{0,80}?(?:(?<!\w)U\.?S\.?|United\s+States)\s*(?:citizens?|persons?|nationals?)|(?:must\s+be|shall\s+be|required\s+to\s+be)[^\n]{0,80}?(?:(?<!\w)U\.?S\.?|United\s+States)\s*(?:citizens?|persons?|nationals?)[^\n]{0,200}?(?:export\s+(?:control|regulation|administration)s?|(?<!\w)I\.?T\.?A\.?R\.?(?!\w)))'

      - id: us_citizen_standalone_required
        requiredness: required
        implies: citizenship_required
        jurisdiction: us
        scope: sentence
        requirement_text: "Must be a US citizen"
        # A bare noun phrase used AS the requirement: a qualifications bullet reading
        # `US Citizen.` or `US Citizenship with an active Secret clearance`. No marker verb
        # exists anywhere in the clause, so every marker-first and marker-last arm above is
        # structurally unreachable.
        #
        # THE ANCHOR IS WHAT MAKES THIS SAFE. It fires only when the citizenship noun OPENS
        # its sentence and is immediately closed by punctuation or a small continuation set.
        # Unanchored it matched `... operated by the U.S. Citizenship and Immigration
        # Services.` -- the E-Verify boilerplate that appears in a large share of US postings
        # and names no requirement at all. That span is a NEGATIVE CONTROL, measured both ways.
        #
        # AND IT STOPS AT THE BARE NOUN. An `is required` continuation is deliberately NOT
        # accepted, because `us_citizen_required`'s marker-LAST arm already owns that form.
        # Accepting it here put a SECOND row on `U.S. citizenship is required, or candidates
        # must hold lawful permanent resident status.` -- and because the two rows carry
        # different values from ONE exclusive group (`citizenship_required` against
        # `citizen_or_lpr_required`), the group conflicted and rewrote BOTH to unknown. Seven
        # corpus cases went `ineligible`/`eligible` -> `uncertain` on that alone. A recall
        # pattern that dissolves a decided sibling is a LOOSENING wearing a fix's name.
        suppressed_by_sentence:
          - "Citizenship\\s+and\\s+Immigration"
          - "citizenship\\s+status"
          - "(?:not|non-?discriminat|regardless\\s+of)"
        # `(` joins the terminator set: "US Citizens only (no dual citizenship)." is a LIVE
        # posting that produced ZERO work_auth rows because the clause ends in a parenthetical
        # rather than a full stop. The terminator is what stops this pattern swallowing a
        # sentence that merely BEGINS with the phrase, so it is widened by ONE character rather
        # than removed. The three sentence escapes above keep EEO boilerplate and
        # "Citizenship and Immigration Services" silent and are unchanged.
        pattern: '^\s*(?:[-*\u2022\u25cf\u00b7]\s*)?(?:(?<!\w)U\.?S\.?|United\s+States)\s+Citizens?(?:hip)?(?:\s+(?:required|only))?\s*(?:[.:;(]|\s*$|,?\s+(?:with|and\s+an?\s+active))'

      - id: us_citizen_predicate_required
        requiredness: required
        implies: citizenship_required
        jurisdiction: us
        scope: sentence
        requirement_text: "Must be a US citizen"
        # Two predicate forms the marker vocabulary cannot reach. `who are US citizens` puts
        # the requirement in a relative clause with no marker verb of its own; `mandates ...
        # be United States citizens` uses a marker verb (`mandates`) deliberately absent from
        # the shared vocabulary, because adding it there would apply it to all six siblings.
        pattern: '(?:who\s+(?:are|must\s+be)\s+(?:(?<!\w)U\.?S\.?|United\s+States|American)\s+citizens?|(?:mandates?|stipulates?|dictates?)\s+[^\n]{0,90}?\bbe\s+(?:(?<!\w)U\.?S\.?|United\s+States|American)\s+citizens?)'

      # Both sponsorship patterns CAPTURE the jurisdiction their sentence scopes itself to.
      # Untethered, "For roles based in Canada, visa sponsorship is available." answered `met`
      # to a US applicant needing US sponsorship, and "For the London position, we cannot
      # offer visa sponsorship." answered `unmet`. A statement about another country decides
      # nothing, in either direction. One capture beats eight near-duplicate declared-
      # jurisdiction patterns, and a surface form absent from the map resolves to `other`,
      # which never equals a declared fact jurisdiction, so an unlisted country abstains.
      # SENTENCE scope, not clause: the scoping phrase is separated from the restriction by a
      # comma, which the clause splitter cuts.
      - id: no_sponsorship_offered
        requiredness: required
        implies: sponsorship_unavailable
        scope: sentence
        # The only pattern that legitimately consumes its own negation: here the cue IS the
        # restriction ("we do NOT offer sponsorship"). Every other pattern must be dropped when
        # a cue lands inside its span, which is what the slice A guard enforces.
        # FINDING 59, found by a positive CONTROL and reported by neither review family: every
        # entry here must be QUOTED. Unquoted `no` is a YAML 1.1 BOOLEAN, so it loaded as False,
        # became the string "False", and the `no` cue was therefore never consumed. Every
        # "No visa sponsorship is available." form was dropped as cue-inside:no and returned a
        # wrong `eligible` with ZERO rows. Nothing raised, and 342 green cases never saw it.
        # `negation_cues` above was always safe because its entries are quoted. The loader now
        # rejects a non-string entry AND an entry that is not a declared negation cue, because a
        # cue that is not a cue can never do anything and fails in silence.
        consumes_cues: ["not", "cannot", "can't", "won't", "doesn't", "don't", "no",
                        "never", "neither", "nor"]
        requirement_text: "Visa sponsorship is not offered for this role"
        # An ADJECTIVAL surface is the commonest way a posting scopes a statement to a country
        # ("For Canadian jobs, ..."), and only `canadian` was here. The rest of the adjectives
        # were absent from BOTH the surface alternation and this map, so "For German jobs, visa
        # sponsorship is available." abandoned the prefix and matched jurisdiction-FREE, telling
        # a US candidate `met` on an offer scoped to Germany. Same defect as finding 54's noun
        # list, one layer down. A surface deliberately LEFT OUT of this map (indian, australian,
        # japanese and the rest) is not an oversight: it has no declared fact jurisdiction, and
        # an unrecognised country must ABSTAIN rather than silently read as `us`.
        jurisdiction_map: &jurisdiction_surfaces
          canada: ca
          canadian: ca
          unitedkingdom: uk
          uk: uk
          london: uk
          england: uk
          britain: uk
          british: uk
          europe: eu
          european: eu
          europeanunion: eu
          eu: eu
          germany: eu
          german: eu
          france: eu
          french: eu
          ireland: eu
          irish: eu
          netherlands: eu
          dutch: eu
          spain: eu
          spanish: eu
          poland: eu
          polish: eu
          unitedstates: us
          us: us
          usa: us
          america: us
          american: us
        pattern: '(?:(?:for|in)\s+(?:the\s+|our\s+)?(?:roles?|positions?|candidates?|applicants?|hires?|employees?|openings?|jobs?|vacancies|vacancy|listings?|reqs?)?\s*(?:based\s+)?(?:in\s+)?(?:the\s+)?(?<!\w)(?P<juris_pre>Canadian|Canada|United\s+Kingdom|(?<!\w)U\.?K\.?|London|England|British|Britain|European\s+Union|European|Europe|(?<!\w)E\.?U\.?|United\s+States|(?<!\w)U\.?S\.?A?\.?|American|America|Germany|German|France|French|Ireland|Irish|Netherlands|Dutch|Spain|Spanish|Poland|Polish|Indian|India|Australian|Australia|Singaporean|Singapore|Japanese|Japan|Brazilian|Brazil|Mexican|Mexico|Israeli|Israel)(?!\w)(?:-based)?\s*(?:roles?|positions?|office|jobs?|vacancies|vacancy|listings?|reqs?)?\s*[,:]?\s+(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice)\b)\w+\s+){0,3}?)?(?:(?:un(?:able|willing)\s+to\s+(?:provide|offer|sponsor)|(?:do(?:es)?\s+not|cannot|can\x27t|will\s+not|won\x27t|(?:will\s+)?never)\s+(?:currently\s+)?(?:provide|offer|sponsor)|not\s+(?:(?:able|willing)\s+to\s+)?(?:provide|offer|sponsor)|not\s+eligible\s+for)\s*(?:[\w-]+\s+){0,4}?(?:visa\s+)?sponsorship|(?:un(?:able|willing)\s+to|not\s+(?:able|willing)\s+to|do(?:es)?\s+not|cannot|can\x27t|will\s+not|won\x27t|(?:will\s+)?never)\s+(?:currently\s+)?sponsor\s+(?:(?:individuals?|candidates?|applicants?|employees?|persons?|people|workers?|hires?|staff)\s+for\s+)?(?:[\w-]+\s+){0,2}?(?:visas?|work\s+visas?|employment\s+visas?|H-?1B|H1-?B|TN|O-?1|E-?3|green\s*cards?|immigration|work\s+permits?)|no\s+(?:visa\s+|work\s+visa\s+|employment\s+)?sponsorship(?:\s*(?:is\s+|are\s+|will\s+be\s+)?(?:available|offered|provided))?|sponsorship\s+(?:is\s+|are\s+|will\s+be\s+)?(?:(?:not|no\s+longer|never)\s+(?:currently\s+)?(?:available|offered|provided)|unavailable)|sponsorship\s+(?:is|are|will|can|would)\s+not\s+(?:be\s+)?(?:currently\s+)?(?:available|offered|provided|granted))(?:\s+(?:for|in)\s+(?:the\s+|our\s+)?(?:roles?|positions?|candidates?|applicants?|hires?|employees?|openings?|jobs?|vacancies|vacancy|listings?|reqs?)?\s*(?:based\s+)?(?:in\s+)?(?:the\s+)?(?<!\w)(?P<juris_post>Canadian|Canada|United\s+Kingdom|(?<!\w)U\.?K\.?|London|England|British|Britain|European\s+Union|European|Europe|(?<!\w)E\.?U\.?|United\s+States|(?<!\w)U\.?S\.?A?\.?|American|America|Germany|German|France|French|Ireland|Irish|Netherlands|Dutch|Spain|Spanish|Poland|Polish|Indian|India|Australian|Australia|Singaporean|Singapore|Japanese|Japan|Brazilian|Brazil|Mexican|Mexico|Israeli|Israel)(?!\w)(?:-based)?\s*(?:roles?|positions?|office|jobs?|vacancies|vacancy|listings?|reqs?)?)?'
      # A SECOND determiner was missing before the captured country, on all four jurisdiction
      # sites. "We do not sponsor visas for roles in the United States." captured NOTHING and
      # read as a jurisdiction-FREE restriction, which told a Canada-targeting candidate
      # `ineligible` on a US-scoped refusal, and the availability twin told them `met` on a
      # US-scoped offer. A wrong verdict in BOTH directions. The juris_pre sites looked immune
      # only by accident: the pattern is unanchored, so the engine restarts at the later
      # `in the United States` and captures there. The juris_post tail is anchored to the
      # restriction text and cannot restart, which is why only it showed the defect. Every
      # jurisdiction case in the harness used the pre form, so nothing failed -- a dropped
      # capture has no row to assert on.
      # FINDING 54, on BOTH sponsorship patterns: the jurisdiction wrapper's noun lists could
      # not consume `jobs`, so "For Canadian jobs, visa sponsorship is available." failed the
      # optional prefix, ABANDONED it, and started a jurisdiction-FREE match at `visa
      # sponsorship` -- a wrong `met` for a US candidate on an offer scoped to Canada. Fixed by
      # completing the noun lists (jobs, vacancies, listings, reqs) rather than by GPT's
      # sentence-scan alternative, which was REJECTED: scanning the sentence for a country can
      # attach a jurisdiction to a sentence that merely MENTIONS one, and "We have engineers in
      # Canada, Germany and India, and visa sponsorship is available." is a genuinely unscoped
      # offer. That case is a permanent control.
      - id: sponsorship_available
        requiredness: bonus
        implies: sponsorship_available
        scope: sentence
        jurisdiction_map: *jurisdiction_surfaces
        requirement_text: "Visa sponsorship is available"
        # The willing-to-sponsor form now requires an IMMIGRATION object. Bare, it fired on
        # "We are willing to sponsor the regional robotics championship each spring." and
        # told a candidate needing a visa that the posting had offered them one.
        pattern: '(?:(?:for|in)\s+(?:the\s+|our\s+)?(?:roles?|positions?|candidates?|applicants?|hires?|employees?|openings?|jobs?|vacancies|vacancy|listings?|reqs?)?\s*(?:based\s+)?(?:in\s+)?(?:the\s+)?(?<!\w)(?P<juris_pre>Canadian|Canada|United\s+Kingdom|(?<!\w)U\.?K\.?|London|England|British|Britain|European\s+Union|European|Europe|(?<!\w)E\.?U\.?|United\s+States|(?<!\w)U\.?S\.?A?\.?|American|America|Germany|German|France|French|Ireland|Irish|Netherlands|Dutch|Spain|Spanish|Poland|Polish|Indian|India|Australian|Australia|Singaporean|Singapore|Japanese|Japan|Brazilian|Brazil|Mexican|Mexico|Israeli|Israel)(?!\w)(?:-based)?\s*(?:roles?|positions?|office|jobs?|vacancies|vacancy|listings?|reqs?)?\s*[,:]?\s+(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice)\b)\w+\s+){0,3}?)?(?:(?<!\w)(?:happy|able|willing|glad|prepared)\s+to\s+(?:provide\s+|offer\s+)?sponsor(?:ship\s+for)?\s+(?:\w+\s+){0,2}?(?:visas?|work\s+visas?|employment\s+visas?|employment|immigration|green\s*cards?|H-?1B|H1-?B|TN|O-?1|E-?3|work\s+permits?)|(?:visa\s+)?sponsorship\s+(?:is\s+|are\s+|will\s+be\s+)?(?:available|offered|provided)|(?:do(?:es)?|we|will)\s+(?:provide|offer)\s+(?:visa\s+)?sponsorship|we\s+sponsor\s+(?:visas|work\s+visas))(?:\s+(?:for|in)\s+(?:the\s+|our\s+)?(?:roles?|positions?|candidates?|applicants?|hires?|employees?|openings?|jobs?|vacancies|vacancy|listings?|reqs?)?\s*(?:based\s+)?(?:in\s+)?(?:the\s+)?(?<!\w)(?P<juris_post>Canadian|Canada|United\s+Kingdom|(?<!\w)U\.?K\.?|London|England|British|Britain|European\s+Union|European|Europe|(?<!\w)E\.?U\.?|United\s+States|(?<!\w)U\.?S\.?A?\.?|American|America|Germany|German|France|French|Ireland|Irish|Netherlands|Dutch|Spain|Spanish|Poland|Polish|Indian|India|Australian|Australia|Singaporean|Singapore|Japanese|Japan|Brazilian|Brazil|Mexican|Mexico|Israeli|Israel)(?!\w)(?:-based)?\s*(?:roles?|positions?|office|jobs?|vacancies|vacancy|listings?|reqs?)?)?'
      # FINDING (2026-08-30 audit): "...authorized to work in the US WITHOUT sponsorship" is the
      # commonest sponsorship-blocking sentence, and it previously produced ONLY an
      # authorization_required row -- MET for an ead_or_similar holder -- never the sponsorship
      # restriction it actually states, so an EAD holder who needs future sponsorship was cleared.
      # The negation_cue_idioms entry keeps "without ... sponsorship" non-polar (so it does not
      # delete the authorization gate); this pattern is what turns that same clause into the
      # sponsorship_unavailable row the resolver already knows how to decide (UNMET for a declared
      # needs_sponsorship, MET for a citizen -- multi-tenant safe). Surfaces mirror the two idiom
      # entries above; the cues are declared consumed so the in-span "without"/"no" are not dropped.
      - id: no_sponsorship_without_clause
        requiredness: required
        implies: sponsorship_unavailable
        scope: sentence
        consumes_cues: ["without", "no"]
        requirement_text: "Work authorization without sponsorship is required"
        pattern: '(?:without\s+(?:(?:the|a|any)\s+need\s+(?:for|of)\s+|requiring\s+|needing\s+|current\s+or\s+future\s+)?(?:employer\s+|company\s+|visa\s+|work\s+visa\s+|immigration\s+|employment[\s-]+based\s+visa\s+)?sponsorship|with\s+no\s+(?:need\s+(?:for|of)\s+)?(?:employer\s+|company\s+|visa\s+)?sponsorship)'
      # FINDING (2026-08-30 audit): "We will not consider candidates who require sponsorship, now or
      # in the future" carries no refusal-verb frame (provide|offer|sponsor), so no_sponsorship_offered
      # never fired and the sentence cleared by silence. The "not" cue sits inside the span and is
      # declared consumed. Structure: "<refuse> ... <accept-verb> ... <require/need> sponsorship".
      #
      # `never` IS DECLARED because the pattern's refusal alternation spells `will\s+never`, so
      # "We will never consider candidates who require visa sponsorship." MATCHED and was then
      # dropped as cue-inside -- a polarity bug that reads exactly like a recall gap. The sibling
      # `no_sponsorship_offered` above already declares it. Do not prune this list to the cues
      # that look reachable by eye: a cue the pattern can span but does not declare is a rule
      # that deletes its own row in silence.
      - id: no_sponsorship_will_not_consider
        requiredness: required
        implies: sponsorship_unavailable
        scope: sentence
        consumes_cues: ["not", "cannot", "won't", "no", "never"]
        requirement_text: "Candidates requiring sponsorship are not considered"
        pattern: '(?:will\s+not|do(?:es)?\s+not|cannot|can\x27t|will\s+never|won\x27t|(?:are|is)\s+unable\s+to)\s+(?:(?!\b(?:and|but|while|whereas)\b)[\w-]+\s+){0,3}?(?:consider|accept|hire|employ|entertain)\s+(?:(?!\b(?:and|but|while|whereas)\b)[\w\x27-]+\s+){0,6}?(?:requir(?:e|ing|es)|need(?:s|ing)?)\s+(?:(?!\b(?:and|but|while|whereas)\b)[\w-]+\s+){0,3}?sponsorship'

  - id: experience_years
    label: Years of experience
    tier: profile
    fact: total_years_experience
    answer_type: int
    default_policy: preference
    # The NEAR-MISS band (D-333). A `minimum`-style bar at or under this many years resolves
    # UNKNOWN instead of UNMET, so the lead lands `uncertain` rather than being rejected.
    #
    # Why a band at all: the reject pile is never inspected, so a wrong `unmet` here is
    # invisible by construction -- boardwatch never applies, so no outcome loop can ever
    # contradict it. Measured on the live store, `experience_years` drives ~89% of the
    # reject pile against a profile declaring ONE year, and 8,745 postings were rejected for
    # needing 3 years or fewer. Internships, co-ops and course projects routinely clear a
    # 2-3 year bar, and `total_years_experience` is a single integer that can represent none
    # of them.
    #
    # Why UNKNOWN and not a `preference` severity: severity is resolved per FAMILY
    # (`catalog.py`), so it cannot express a threshold, and a `preference` row leaves
    # `engine.blocking()` entirely -- the verdict then falls through to `eligible`, which
    # ASSERTS the candidate qualifies. `unknown` is caught by `blocking(UNKNOWN)` first and
    # yields `uncertain`, so this band can never manufacture an `eligible`.
    #
    # 0 disables it, which is every other family. Raising it is not free: each extra year
    # moves genuinely-too-senior postings into the delivered pool. Re-measure before moving
    # it, and note the bound is CLOSED -- 3 abstains, 4 rejects.
    near_miss_years_ceiling: 3
    question: "How many total years of professional experience do you have?"
    fields:
      - name: total_years_experience
        type: int
    implies_vocabulary:
      - total_years_minimum
      - range_years_minimum
      - scoped_years_minimum
      - activity_years_minimum
      - total_years_preferred
      - range_years_preferred
    # These are PARALLEL BARS, not competing claims: a total-years floor beside a Python-years
    # floor declares both requirements. Keep both rows for the roll-up when they agree. Only a
    # profile that clears one member and misses another makes their relationship undecidable,
    # so the refinement group abstains on that MET/UNMET straddle. The regexes are tuned so the
    # common forms fire exactly once; this is the safety net for their genuine disagreement.
    refinement_groups:
      - [total_years_minimum, range_years_minimum, scoped_years_minimum]
    patterns:
      # All three required patterns are SENTENCE-scoped, not clause-scoped, and their
      # suppressors are UNIT-scoped. Both halves are load-bearing:
      #   sentence scope, because the hedge and the grammatical subject that cancel a
      #   requirement routinely sit in another clause of the same sentence
      #   ("Nice to have: 10 years of experience.", "The team has 25 years of experience");
      #   unit scope, because a subject belongs to its own clause and nothing else. Document
      #   scoped, "Our founding team has deep expertise." cancelled the genuine
      #   "We require 8 years of experience." in the NEXT sentence and returned `eligible`.
      # Deliberate deviation from lint rule 2: these patterns carry NO requirement marker.
      # "8 years of relevant professional experience." under a Requirements heading is the
      # single most common form there is, and its marker is the heading, not the sentence.
      # The subject suppressor, not a marker, is what keeps company-side prose out.
      #
      # TWO WIDENINGS RUN THROUGH EVERY PATTERN BELOW, applied to all of them together rather
      # than to the one span that exposed each, because these are twins that mirror one another
      # arm for arm and a JD that writes a bar one way writes every bar in it that way.
      #  * `(?:years?|yrs?)(?!\w)\.?` FOR `years?\b`. Measured 2026-09-05 on a 2,000-posting
      #    random sample of the 32,602 evaluations carrying ZERO requirement rows: "2+ Yrs of
      #    experience" is a bar, and every pattern here spelled the unit one way and wrote no
      #    row at all on the abbreviation. Same class as the months forms above, one spelling
      #    further down. The trailing `\.?` takes "Yrs." and the boundary is a lookahead rather
      #    than `\b` so the period can be consumed AFTER it.
      #  * `(?:\s*,)?` AFTER EACH ADJECTIVE in the run. "2-4 years of professional, post
      #    University experience" stopped the run dead at the comma and no tail could reach
      #    `experience`. It is `(?:\s*,)?` and NOT `\s*,?`: the run is an ATOMIC group, so the
      #    greedy form ate the space separating the run from the domain phrase, could not give
      #    it back, and silently broke "2-12+ years of industry software engineering
      #    experience" -- a span that already matched. Both are corpus rows (m1048, m1049).
      - id: total_years_minimum
        requiredness: required
        implies: total_years_minimum
        scope: sentence
        capture: years
        requirement_text: "At least {years} years of total experience"
        pattern: '(?<![-–—\d])(?<!to\s)\b(?P<years>\d{1,2})\s*\+?\s*(?:or\s+more\s+)?(?:years?|yrs?)(?!\w)\.?[''’]?(?>\s+of)?(?>(?:\s+(?:professional|relevant|industry|work|hands-on|total|overall|full-time|demonstrated|proven|solid|extensive|significant|progressive|prior|recent|direct|applied|practical|dedicated)(?:\s*,)?)*)\s+experience\b(?!\s+(?:with|in|using|of|on|building|developing|designing|as|leading|managing|supporting)\b)'
        # The company-side SUBJECT is a subject suppressor, not a unit suppressor: it must both
        # PRECEDE the span and sit in the same clause. As a unit suppressor it deleted the
        # candidate-side requirement in "Our team has 25 years of experience, and candidates
        # require 5 years of experience." The HEDGE stays a clause suppressor.
        subject_suppressors:
          # `we\\s+(?:bring|have|offer)` carries no noun, so the `our <noun> has` arm above
          # cannot reach it: "We bring 30 years of experience to every engagement." resolved
          # `unmet` against a one-year profile and rejected the posting on the company's own
          # tenure. A requirement addresses the CANDIDATE ("you have", "we require"), never
          # "we bring", so the three verbs are safe to claim for the company side.
          - &company_side_years "(?:our|the)\\s+(?:\\w+\\s+){0,2}(?:team|teams|engineers|founders|leadership|staff|architect|architects|folks|mentors)\\s+(?:has|have|brings?|is|are|was|were|average[sd]?|each)|founded\\s+by|average\\s+of|each\\s+(?:bring|brings|have|has)|we\\s+(?:bring|have|offer)|you\\s+will\\s+(?:work\\s+with|receive|gain|get)|combined\\s+experience|collectively|between\\s+us"
        # A stated PREFERENCE read as a hard floor is the worst wrong verdict this family can
        # produce, so the hedge vocabulary carries the VERB and the PARTICIPLE, not only the
        # adjective: "We prefer 5 years of experience." and "5 years of experience is desired."
        # both fell through to this pattern and told a 3-year candidate INELIGIBLE.
        # Bare `desired` needs the noun lookahead. Attributively it is not a hedge at all:
        # "The desired candidate has 5 years of experience." states a floor, and without the
        # guard the participle deleted it. The verb is anchored to `we`/`preference for` rather
        # than bare `prefer` so that "candidates who prefer remote work" is not a hedge either.
        suppressed_by_unit:
          - &years_hedges "preferred|desirable|a\\s+plus|nice\\s+to\\s+have|ideally|bonus|advantageous|strongly\\s+desired|desired\\b(?!\\s+(?:candidate|applicant|profile|skill|qualification|attribute|trait|background|characteristic|competenc|experience|expertise)\\w*)|we\\s+(?:would\\s+)?prefer|preference\\s+for"
        # A DEGREE-GATED DISJUNCTION ("a Bachelor's ... OR N years of experience") is not a
        # floor: the posting clears on EITHER arm, and the degree arm is undecidable because
        # the field of study is not stored. Reading the pure-years arm as a hard bar told a
        # master's-plus-one-year candidate INELIGIBLE and deleted a real job (Gate-P5 SpaceX
        # FP). So the years bar ABSTAINS here rather than resolving `unmet`, exactly as the
        # degree family abstains on "degree OR equivalent experience" (degree_equivalence).
        # abstain_by, not a suppressor: dropping would return `eligible` by silence; abstain
        # keeps the row visible and undecidable, for the two-stage gate to decide. The `or`
        # must bridge a degree DIRECTLY to a years-of-experience arm, both same-line (no \n
        # in the gap) — "degree in X, Y, or a related field" coordinates FIELDS, not a
        # degree-vs-experience choice, and must not abstain a genuine floor elsewhere.
        abstain_by:
          - &degree_alternative_to_years "(?:(?:Bachelor['’‘]?s?|Master['’‘]?s?|Doctora\\w+|Ph\\.?D\\.?|(?<![\\w.])B\\.?S\\.?(?!\\w)|(?<![\\w.])B\\.?A\\.?(?!\\w)|(?<![\\w.])M\\.?S\\.?(?!\\w)|(?<![\\w.])M\\.?Sc\\.?(?!\\w)|(?<![\\w.])M\\.?Eng\\.?(?!\\w)|(?<![\\w.])M\\.?B\\.?A\\.?(?!\\w)|(?:Graduate|Advanced|Undergraduate)\\s+degree|degree\\s+in)[^.\\n]{0,80}?\\bor\\b\\s*(?:a\\s+minimum\\s+of\\s+|at\\s+least\\s+)?\\d{1,2}\\s*\\+?\\s*years?\\b[^.\\n]{0,25}?experience)|(?:\\d{1,2}\\s*\\+?\\s*years?\\b[^.\\n]{0,25}?experience[^.\\n]{0,40}?\\bor\\b[^.\\n]{0,40}?(?:Bachelor['’‘]?s?|Master['’‘]?s?|Doctora\\w+|Ph\\.?D\\.?|(?<![\\w.])B\\.?S\\.?(?!\\w)|(?<![\\w.])B\\.?A\\.?(?!\\w)|(?<![\\w.])M\\.?S\\.?(?!\\w)|(?<![\\w.])M\\.?Sc\\.?(?!\\w)|(?<![\\w.])M\\.?Eng\\.?(?!\\w)|(?<![\\w.])M\\.?B\\.?A\\.?(?!\\w)|(?:Graduate|Advanced|Undergraduate)\\s+degree|degree\\s+in))"
      # A bar stated in MONTHS is the same bar. Every pattern above requires `years?`, so
      # "at least 18 months of professional experience" wrote NO row at all and the posting
      # carried nothing evaluable -- the shape the keystone treats as a monitoring failure.
      # These two mirror `total_years_minimum` and `scoped_years_minimum` exactly, arm for arm
      # and suppressor for suppressor, and imply the SAME vocabulary: the magnitude is what a
      # bar is, the unit is only how it was written, so a months row and a years row belong in
      # one refinement group rather than two. The resolver converts (`_need_in_years`).
      #
      # MEASURED OVER ALL 61,927 OPEN BODIES BEFORE SHIPPING. The form appears in 1,085, and
      # the distribution decides what these can do: 1,653 occurrences state 12 months or fewer
      # (6 months alone is 1,477) and resolve `met` against a one-year profile; 91 state 13-36
      # months, ALL of which sit inside `near_miss_years_ceiling: 3` and can therefore only
      # resolve `unknown`; and FOUR occurrences state 48 months, the only value in the corpus
      # that can reach `unmet`. So these patterns are an EVIDENCE fix, not a rejection fix:
      # they replace "no row, verdict uncertain" with a cited, resolved row on ~995 postings
      # and a visible abstain on 90. Only 20 of those 90 carry an engineering title -- the
      # population is overwhelmingly retail and warehouse.
      #
      # NO `months_preferred` ARM. A hedged months bar is DROPPED by the shared hedge list,
      # exactly as it is today, so nothing regresses; what stays missing is that a hedged
      # months bar is still invisible where a hedged YEARS bar is carried as `preferred`.
      # Deliberate: the hedged forms in the measured spans are all 6-month retail bars, which
      # would resolve `met` and change no verdict. Revisit with a measurement, not by symmetry.
      #
      # `\d{1,3}`, not `\d{1,2}`: the years patterns cap at 99 years, and 48 months is real.
      # `count(s) as` is a CONVERSION NOTE, not a bar. Measured: 10 postings say "(i.e., 24-week
      # JCAC course may count as 6 months of experience)" and the months pattern read the
      # conversion as the requirement. That is not merely a spurious row -- these patterns imply
      # the same vocabulary as their years twins, so the spurious row joined the refinement group
      # and REWROTE a genuine "7 years of experience" `unmet` in the next sentence to `unknown`,
      # turning a correct rejection into an abstain on all 10. UNIT-scoped, like the hedges: the
      # conversion sits in its own parenthetical clause and must not reach the real bar beside it.
      - id: total_months_minimum
        requiredness: required
        implies: total_years_minimum
        scope: sentence
        capture: months
        requirement_text: "At least {months} months of total experience"
        pattern: '(?<![-–—\d])(?<!to\s)\b(?P<months>\d{1,3})\s*\+?\s*(?:or\s+more\s+)?months?\b[''’]?(?>\s+of)?(?>(?:\s+(?:professional|relevant|industry|work|hands-on|total|overall|full-time|demonstrated|proven|solid|extensive|significant|progressive|prior|recent|direct|applied|practical|dedicated)(?:\s*,)?)*)\s+experience\b(?!\s+(?:with|in|using|of|on|building|developing|designing|as|leading|managing|supporting)\b)'
        subject_suppressors: [*company_side_years]
        suppressed_by_unit: [*years_hedges, &months_conversion "counts?\\s+(?:as|toward|towards)"]
        abstain_by: [*degree_alternative_to_years]
      - id: scoped_months_minimum
        requiredness: required
        implies: scoped_years_minimum
        scope: sentence
        capture: months
        requirement_text: "Months of experience scoped to a specific skill or domain"
        pattern: '(?<![-–—\d])\b(?P<months>\d{1,3})\s*\+?\s*(?:or\s+more\s+)?months?\b[''’]?(?>\s+of)?(?>(?:\s+(?:professional|relevant|industry|work|hands-on|total|overall|full-time|demonstrated|proven|solid|extensive|significant|progressive|prior|recent|direct|applied|practical|dedicated)(?:\s*,)?)*)\s+(?:experience\s+(?:with|in|using|on|building|developing|designing|as|leading|managing|supporting)\b|(?!(?:professional|relevant|industry|work|hands-on|total|overall|full-time|experience|equivalent|of|in|with|the|a|an|and|or|to|for|as|on|at|age|old)\b)[A-Za-z][\w.+#/-]*(?:\s+[\w.+#/-]+){0,3}\s+experience\b)'
        subject_suppressors: [*company_side_years]
        suppressed_by_unit: [*years_hedges, *months_conversion]
        abstain_by_sentence: [*degree_alternative_to_years]
      - id: range_years_minimum
        requiredness: required
        implies: range_years_minimum
        scope: sentence
        capture: years
        requirement_text: "At least {years} years of total experience"
        pattern: '\b(?P<years>\d{1,2})\s*(?:[-–—]|\s+to\s+)\s*\d{1,2}\s*\+?\s*(?:years?|yrs?)(?!\w)\.?[''’]?(?>\s+of)?(?>(?:\s+(?:professional|relevant|industry|work|hands-on|total|overall|full-time|demonstrated|proven|solid|extensive|significant|progressive|prior|recent|direct|applied|practical|dedicated)(?:\s*,)?)*)\s+experience\b(?!\s+(?:with|in|using|of|on|building|developing|designing|as|leading|managing|supporting)\b)'
        subject_suppressors: [*company_side_years]
        suppressed_by_unit: [*years_hedges]
        # Same either-path disjunction guard as total_years_minimum: "3-5 years ... or a
        # Master's degree" clears on either arm and must abstain, not resolve `unmet`.
        abstain_by: [*degree_alternative_to_years]
      # The subject suppressor goes on ALL THREE, not just total_years_minimum. Left off
      # here, scoped_years_minimum fires on the company-side sentence on its own and the
      # refinement group these three share can rewrite the genuine row to unknown on a straddle.
      #
      # THE ARBITRARY-WORD RUN IS {0,3} AND THE NUMBER IS MEASURED, NOT A GUESS (D-447). At
      # {0,2} the pattern could not read a four-word domain phrase, so `5+ years of full stack
      # software engineering experience` and `3+ years of non-internship professional software
      # development experience` wrote NO row at all -- the posting then carried nothing
      # evaluable, landed `uncertain`, and routed to the apply lane as blindly-appliable.
      #
      # Widening a window blind is how a pattern starts matching prose, so this one was read at
      # the scale it runs at BEFORE it shipped: over all 138,677 open bodies it adds 2,355
      # matches across 1,474 distinct spans in 2,269 bodies, and **every one of those spans
      # begins with a year count** -- no ceilings, no company tenure, no EEO boilerplate. The
      # existing `(?<!to\s)` guard, `company_side_years` and `years_hedges` are what hold that,
      # and they are the reason the window can be widened without a new suppressor.
      #
      # {0,4} is NOT the next step by default. Each word added is a word the run may cross a
      # clause boundary on, and the measured yield here came from a four-word DOMAIN PHRASE
      # (`full stack software engineering`), which is a real linguistic unit. Re-measure the
      # span list before moving it again -- a count of new matches is not evidence, the spans
      # are.
      - id: scoped_years_minimum
        requiredness: required
        implies: scoped_years_minimum
        scope: sentence
        subject_suppressors: [*company_side_years]
        suppressed_by_unit: [*years_hedges]
        # THE DEGREE DISJUNCTION REACHES THIS ARM, BOUNDED TO ONE SENTENCE. D-449 is the
        # entry that left this OPEN and named the mechanism; the ruling below closed it.
        # `total_years_minimum` has abstained on "a Bachelor's OR N years of experience" since
        # D-073; these six never did, so the same requirement was undecidable when the JD wrote
        # "years of experience" and a REJECTION when it wrote "years of SOFTWARE ENGINEERING
        # experience". One word decided whether a posting the owner can actually get was deleted
        # from view, and the reject pile is never inspected, so nothing downstream could ever
        # contradict it.
        #
        # MEASURED OVER ALL 147,642 OPEN BODIES, three arms against one another: 996 postings
        # move and 232 of them are SWE+US. EVERY move is `ineligible` -> `uncertain`; nothing
        # moves toward `eligible`, and no other family moves at all. That is structural, not
        # luck -- all six of these patterns imply a `_SCOPED_YEARS` value, and that resolver
        # branch has no `met` at all, so the only row transition available here is
        # `unmet` -> `unknown`. D-449 sized the same class at 581 by where the ESCAPE sits;
        # 232 is the count that actually changes VERDICT, which is smaller because many of
        # those postings are rejected by another family as well.
        #
        # AND THE POPULATION IS NOT THE SHAPE THE OWNER WAS SHOWN. Of the 232, exactly ONE
        # reads "degree OR N years"; 219 read "BS + N years OR MS + M years", where the degree
        # arm carries its own floor and a master's does not clear it alone. That is not new
        # here: `degree_alternative_to_years` has abstained on precisely those sentences on the
        # TOTAL arm since D-073. This change stops the two arms disagreeing; it does not widen
        # what the escape MEANS. Tightening the escape to the literal either/or shape is a
        # separate decision about the REGEX, and it would move the total arm with it.
        #
        # THE OWNER RULED, AND THE RULING IS EXACTLY AS WIDE AS THE SENTENCE: "because of the
        # wording of 'or', degree should clear it". The `or` is the reason, so it is also the
        # bound. `abstain_by_sentence`, NOT `abstain_by`: the document-scoped form would also
        # waive a SEPARATE "8+ years of C++" stated elsewhere in the posting, which the owner
        # ruled the other way on and which 7 postings depend on (D-449). Same regex, and the
        # scope is the whole difference between honouring both rulings and breaking one.
        abstain_by_sentence: [*degree_alternative_to_years]
        requirement_text: "Years of experience scoped to a specific skill or domain"
        pattern: '(?<![-–—\d])\b(?P<years>\d{1,2})\s*\+?\s*(?:or\s+more\s+)?(?:years?|yrs?)(?!\w)\.?[''’]?(?>\s+of)?(?>(?:\s+(?:professional|relevant|industry|work|hands-on|total|overall|full-time|demonstrated|proven|solid|extensive|significant|progressive|prior|recent|direct|applied|practical|dedicated)(?:\s*,)?)*)\s+(?:experience\s+(?:with|in|using|on|building|developing|designing|as|leading|managing|supporting)\b|(?!(?:professional|relevant|industry|work|hands-on|total|overall|full-time|experience|equivalent|of|in|with|the|a|an|and|or|to|for|as|on|at|age|old)\b)[A-Za-z][\w.+#/-]*(?:\s+[\w.+#/-]+){0,3}\s+experience\b)'

      # An activity GERUND standing in for the noun. "5+ years building and deploying web
      # applications" states a floor and never says "experience", so neither the total nor the
      # scoped pattern above can see it -- measured, 37 of the 142 five-plus-year postings in a
      # delivered set produced no row at all. job-apps carries this as its own pattern and names
      # the source: aggregator summaries phrase a floor this way, and hiring.cafe is one of
      # boardwatch's own lanes, so the miss lands on a population it actively ingests.
      #
      # Its own vocabulary value, and deliberately OUTSIDE the refinement group. It resolves
      # exactly as scoped_years_minimum does -- only in the direction the total forces (D-319) --
      # but it must not share that value: `engine.evaluate` collects group membership
      # DOCUMENT-wide, not per sentence, so a scoped row here would join the refinement group's
      # straddle test against a `total_years_minimum` row in an unrelated sentence.
      # Measured, and it still bears under refinement semantics: as `scoped_years_minimum` this
      # destroyed Disney's genuine "A minimum of 3 years of relevant experience" block, because
      # a different line read "3 year of developing cloud native applications". The group no
      # longer dissolves on mere co-occurrence, but a profile that CLEARS one of those lines
      # and MISSES the other still straddles them, so keeping this value out of the group is
      # what stops an unrelated sentence from reaching the genuine row at all.
      #
      # `(?<!to\s)` is load-bearing: "Up to 3 years building web applications" bounds the
      # candidate from ABOVE, and read as a floor it rejects the new-grad postings this tool
      # exists to find.
      - id: scoped_years_activity
        requiredness: required
        implies: activity_years_minimum
        scope: sentence
        subject_suppressors: [*company_side_years]
        suppressed_by_unit: [*years_hedges]
        # The sentence-scoped degree escape, as on scoped_years_minimum.
        abstain_by_sentence: [*degree_alternative_to_years]
        requirement_text: "Years of experience scoped to a specific activity"
        pattern: '(?<![-–—\d])(?<!to\s)\b(?P<years>\d{1,2})\s*\+?\s*(?:or\s+more\s+)?(?:years?|yrs?)(?!\w)\.?[''’]?(?>\s+of)?\s+(?:building|developing|writing|designing|shipping|delivering|creating|working|leading|architecting|managing|maintaining|operating|scaling)\b'

      # FINDING (2026-08-30 queue audit): a RANGE could never reach the SCOPED tail, so the
      # commonest way a JD states a bar -- "3-6 years of professional software engineering
      # experience" -- produced NO experience row at all and the lead rode the delivery
      # fail-open into the apply queue. Neither existing rule could fire: `scoped_years_minimum`
      # is blocked at the low number (no bare `years` follows it) and at the high number (its
      # `(?<![-–—\d])` lookbehind), while `range_years_minimum` demands `experience` immediately
      # after the adjective run and so dies on any domain noun ("... professional SOFTWARE
      # ENGINEERING experience") and on `experience IN` / `experience AS`.
      #
      # These two are the range head of `range_years_minimum` spliced onto the scoped and
      # activity tails VERBATIM -- composed from those patterns rather than retyped, so the
      # tails cannot drift from the twins they mirror. `years` captures the LOW end of the
      # range, exactly as `range_years_minimum` does, which is the conservative read: a
      # "3-6 years" bar is unmet for a 1-year profile on its floor alone.
      #
      # They carry the SAME suppressors as their twins, which is what keeps company-side prose
      # out: "Our team has 10-15 years of combined experience" is stood down by
      # `company_side_years`, and a hedged range by `years_hedges` (the hedged range already has
      # its own `range_years_preferred`).
      - id: scoped_range_years_minimum
        requiredness: required
        implies: scoped_years_minimum
        scope: sentence
        subject_suppressors: [*company_side_years]
        suppressed_by_unit: [*years_hedges]
        # The sentence-scoped degree escape, as on scoped_years_minimum.
        abstain_by_sentence: [*degree_alternative_to_years]
        requirement_text: "Years of experience scoped to a specific skill or domain"
        pattern: '\b(?P<years>\d{1,2})\s*(?:[-–—]|\s+to\s+)\s*\d{1,2}\s*\+?\s*(?:years?|yrs?)(?!\w)\.?[''’]?(?>\s+of)?(?>(?:\s+(?:professional|relevant|industry|work|hands-on|total|overall|full-time|demonstrated|proven|solid|extensive|significant|progressive|prior|recent|direct|applied|practical|dedicated)(?:\s*,)?)*)\s+(?:experience\s+(?:with|in|using|on|building|developing|designing|as|leading|managing|supporting)\b|(?!(?:professional|relevant|industry|work|hands-on|total|overall|full-time|experience|equivalent|of|in|with|the|a|an|and|or|to|for|as|on|at|age|old)\b)[A-Za-z][\w.+#/-]*(?:\s+[\w.+#/-]+){0,3}\s+experience\b)'
      - id: scoped_range_years_activity
        requiredness: required
        implies: activity_years_minimum
        scope: sentence
        subject_suppressors: [*company_side_years]
        suppressed_by_unit: [*years_hedges]
        # The sentence-scoped degree escape, as on scoped_years_minimum.
        abstain_by_sentence: [*degree_alternative_to_years]
        requirement_text: "Years of experience scoped to a specific activity"
        pattern: '\b(?P<years>\d{1,2})\s*(?:[-–—]|\s+to\s+)\s*\d{1,2}\s*\+?\s*(?:years?|yrs?)(?!\w)\.?[''’]?(?>\s+of)?\s+(?:building|developing|writing|designing|shipping|delivering|creating|working|leading|architecting|managing|maintaining|operating|scaling)\b'

      # TWO MORE RECALL SIBLINGS (2026-08-30 queue audit, second pass). Measured against the
      # live apply lane AFTER the range fix landed: 25 postings still stated a bar and produced
      # no row. They fall into exactly two shapes, and the residue was re-measured rather than
      # taken from the earlier session's list -- which named shapes that the range fix had
      # already closed, and missed the commonest one entirely.
      #
      # SHAPE 1, the DOMAIN LIST. `scoped_years_minimum`'s second tail alternative allows a
      # head word plus at most two more before `experience`, and its word run is `[\w.+#/-]+`,
      # which cannot cross a COMMA. Real postings enumerate:
      #   "4+ years of software engineering or SRE experience"          (4 words)
      #   "5+ years of DevOps, platform engineering, or SRE experience" (commas)
      #   "3+ years of software development, software systems engineering, or software
      #    validation experience"
      # This sibling keeps the literal `experience` noun as the anchor -- the whole match still
      # ends on it -- and only widens what may sit between it and the number.
      #
      # TWO CONSTRAINTS EARNED FROM THE FIRST DRAFT, which was gated and measured before it
      # was believed:
      #  * A LIST CONNECTOR IS MANDATORY. Without one this pattern matched everywhere the
      #    plain scoped tail already matches, putting a duplicate row on 72 corpus cases. It
      #    exists for the enumerated form, so the comma or the `and`/`or` is required rather
      #    than optional, which keeps it disjoint from the twin instead of a superset of it.
      #  * IT TAKES `activity_years_minimum`, NOT `scoped_years_minimum`, for the reason
      #    spelled out at `scoped_years_activity`: group membership is collected
      #    DOCUMENT-wide, so a scoped value here would join the refinement straddle test
      #    against a `total_years_minimum` row in an unrelated sentence.
      - id: domain_list_years_minimum
        requiredness: required
        implies: activity_years_minimum
        scope: sentence
        subject_suppressors: [*company_side_years]
        suppressed_by_unit: [*years_hedges]
        # The sentence-scoped degree escape, as on scoped_years_minimum.
        abstain_by_sentence: [*degree_alternative_to_years]
        requirement_text: "Years of experience scoped to a specific skill or domain"
        pattern: '(?<![-–—\d])(?<!to\s)\b(?P<years>\d{1,2})\s*\+?\s*(?:or\s+more\s+)?(?:years?|yrs?)(?!\w)\.?[''’]?(?>\s+(?:of|in))?(?>(?:\s+(?:professional|relevant|industry|work|hands-on|total|overall|full-time|demonstrated|proven|solid|extensive|significant|progressive|prior|recent|direct|applied|practical|dedicated)(?:\s*,)?)*)\s+(?!(?:age|old|experience|equivalent|the|a|an|and|or|to|for|as|on|at)\b)[A-Za-z][\w.+#/-]*(?:\s*(?:,|/)?\s*(?:and\s+|or\s+)?[\w.+#/-]+){0,4}?\s*(?:,\s*|\s+(?:and|or)\s+)(?:[\w.+#/-]+\s+){0,3}?experience\b'

      # SHAPE 2, NO `experience` NOUN ANYWHERE. "5+ years'' embedded SW", "15+ Years of Systems
      # Engineering:", "2 years in SaaS, PaaS, or IaaS software development", "5 years of
      # service in a related hardware/software position", "3+ year web development". The
      # number and the domain carry the whole requirement; there is no noun for either scoped
      # tail to anchor on, and no gerund for `scoped_years_activity`.
      #
      # THREE GUARDS, each earned from a span in the live residue rather than imagined:
      #  * YEARS BOUNDED 2-19. Every false positive in the measured residue was company-side
      #    tenure prose with a big number -- "30+ years of pioneering robotics research"
      #    (Carnegie Mellon), "25 years. It''s a unique legacy of innovation" (NVIDIA). No
      #    posting asks a candidate for 20+ years, so the bound costs nothing real and it is
      #    cheaper and more legible than extending `company_side_years` to cover every way an
      #    employer can boast about its own age.
      #  * A STOPWORD HEAD. The HEDGES are in it as well as the tenure words: `5 years of
      #    experience is required, 10 years preferred.` is one sentence, so the trailing
      #    `10 years preferred` is reachable even though the hedge suppressor stood the
      #    first half down -- the number a hedge qualifies is not a floor.
      #    The COPULAS and modals are in it for a third reason again: `... 8 years is
      #    preferred` and `... 3 years must be in a technical leadership role` put the verb
      #    where a domain noun belongs, and a bare `is`/`must` is not a domain.
      #    `pioneering`, `helping`, `combined`, and the determiners keep the
      #    remaining tenure prose out. `or` and `older` are in it for a FOURTH reason, added
      #    2026-09-05: `age` and `old` were there from the start but "Applicants must be 18
      #    years or older." puts neither word next, so `or` was read as the head of a domain
      #    phrase and an AGE floor resolved `unmet` -- 18 is past the near-miss band and this
      #    value has no `met`, so the posting was deleted from view by a bar it never stated. The GERUNDS are listed for a second reason: they belong
      #    to `scoped_years_activity`, and letting both fire would put two rows on one span.
      #  * NO `experience` NOUN IN THE REST OF THE CLAUSE. This is the pattern's own
      #    definition made enforceable rather than merely stated: without it the pattern also
      #    fired on every span the two scoped tails already cover, putting three rows on one
      #    "2+ years of industry software engineering experience" instead of one. The verdict
      #    was unchanged -- all three resolve the same way -- but the abstain report counts
      #    rows, so the noise would have shown up as a fake jump in experience detections.
      #  * `(?<!to\s)`, inherited from the activity twin. "Up to 3 years web development"
      #    bounds from ABOVE; read as a floor it rejects exactly the new-grad postings this
      #    tool exists to find.
      #
      # It takes `activity_years_minimum`, NOT `scoped_years_minimum`, and the reason is the
      # one written out at `scoped_years_activity`: group membership is collected
      # DOCUMENT-wide, so a scoped value here would join the refinement straddle test against
      # a `total_years_minimum` row in an unrelated sentence.
      - id: domain_years_minimum
        requiredness: required
        implies: activity_years_minimum
        scope: sentence
        subject_suppressors: [*company_side_years]
        suppressed_by_unit: [*years_hedges]
        # The sentence-scoped degree escape, as on scoped_years_minimum.
        abstain_by_sentence: [*degree_alternative_to_years]
        requirement_text: "Years of experience scoped to a specific domain"
        pattern: '(?<![-–—\d])(?<!to\s)\b(?P<years>[2-9]|1[0-9])\s*\+?\s*(?:or\s+more\s+)?(?:years?|yrs?)(?!\w)\.?[''’]?(?>\s+(?:of|in|with))?(?>(?:\s+(?:professional|relevant|industry|work|hands-on|total|overall|full-time|demonstrated|proven|solid|extensive|significant|progressive|prior|recent|direct|applied|practical|dedicated)(?:\s*,)?)*)\s+(?![^.\n]{0,80}?\bexperience\b)(?!(?:age|old|experience|equivalent|the|a|an|this|that|our|its|their|his|her|your|my|combined|pioneering|helping|building|developing|writing|designing|shipping|delivering|creating|working|leading|architecting|managing|maintaining|operating|scaling|college|school|university|education|graduation|residency|tenure|innovation|growth|excellence|success|business|history|preferred|desirable|desired|ideally|bonus|plus|is|are|was|were|be|been|must|will|can|may|should|has|have|had|of|in|at|on|for|with|to|or|older)\b)[A-Za-z][\w.+#/-]*(?:\s*(?:,|/)?\s*(?:and\s+|or\s+)?[\w.+#/-]+){0,4}'

      # SHAPE 3, THE NOUN FIRST. "Experience Required: 3 to 5 years", "Experience Required
      # -6+ Years". Every pattern above reads left to right from the NUMBER, so all of them
      # need the bar's noun (or a domain phrase, or a gerund) to FOLLOW the count. When the
      # posting labels the block instead -- the noun, a separator, then the count, and nothing
      # after it -- there is no tail to anchor on and the posting carried no experience row at
      # all. Measured 2026-09-05 on a 2,000-posting random sample of the zero-row population,
      # this shape and the two widenings beside it account for the "N years ... experience"
      # phrasings the catalog matched nothing on.
      #
      # ONE pattern rather than a total/range pair, because the range is the only difference:
      # the optional `(?:[-–—]|to) M` arm captures the LOW end exactly as `range_years_minimum`
      # does, which is the conservative read of a "3 to 5 years" bar. So it implies
      # `total_years_minimum` in both forms, and joins the refinement group through that value.
      #
      # THE SEPARATOR IS MANDATORY, and it is what keeps salary prose out. `Experience` is a
      # common word; without a `:` or a dash directly before the number the pattern would read
      # any nearby count as a bar. With it, "Compensation and Experience: $100,000 - $115,000
      # year" cannot match -- the run between the separator and the digits is whitespace only,
      # so the pattern can never skip a currency symbol or a thousands group to reach a
      # two-digit number.
      #
      # Same suppressors as `total_years_minimum`, for the same reasons: a labelled block is
      # as capable of being hedged ("Experience Preferred: 5 years") or company-side as any
      # other, and a degree disjunction waives this bar as it waives that one.
      - id: labeled_years_minimum
        requiredness: required
        implies: total_years_minimum
        scope: sentence
        capture: years
        requirement_text: "At least {years} years of total experience"
        pattern: '\bexperience(?:\s+(?:required|requirements?|needed|level|range))?\s*[:\-–—]+\s*(?:(?:at\s+least|a\s+minimum\s+of|minimum\s+of|min\.?)\s+)?(?P<years>\d{1,2})\s*(?:(?:[-–—]|\s+to\s+)\s*\d{1,2})?\s*\+?\s*(?:years?|yrs?)(?!\w)\.?'
        subject_suppressors: [*company_side_years]
        suppressed_by_unit: [*years_hedges]
        abstain_by: [*degree_alternative_to_years]

      # Hedged variants. Without them every hedge was a hard blocker: "5+ years of experience
      # preferred." told a 2-year candidate they were INELIGIBLE. Two alternatives per
      # pattern because the hedge sits on either side of the number, and one regex cannot
      # name a group twice, so the second layout captures `years_alt`.
      - id: total_years_preferred
        requiredness: preferred
        implies: total_years_preferred
        scope: sentence
        capture: years
        requirement_text: "{years} years of total experience is preferred"
        pattern: '(?:(?<![-–—\d])(?<!to\s)\b(?P<years>\d{1,2})\s*\+?\s*(?:or\s+more\s+)?(?:years?|yrs?)(?!\w)\.?(?>\s+of)?(?>(?:\s+(?:professional|relevant|industry|work|hands-on|total|overall|full-time)(?:\s*,)?)*)\s+experience\b(?!\s+(?:with|in|using|of|on|building|developing|designing|as|leading|managing|supporting)\b)[^.]{0,25}?(?:preferred|desirable|a\s+plus|nice\s+to\s+have|bonus|advantageous|desired\b(?!\s+(?:candidate|applicant|profile|skill|qualification|attribute|trait|background|characteristic|competenc|experience|expertise)\w*))|(?:nice\s+to\s+have|ideally|preferred|desirable|bonus|advantageous|desired\b(?!\s+(?:candidate|applicant|profile|skill|qualification|attribute|trait|background|characteristic|competenc|experience|expertise)\w*)|we\s+(?:would\s+)?prefer|preference\s+for)\s*[:,]?\s*(?:(?:at\s+least|a\s+minimum\s+of|minimum\s+of)\s+)?(?<![-–—\d])\b(?P<years_alt>\d{1,2})\s*\+?\s*(?:or\s+more\s+)?(?:years?|yrs?)(?!\w)\.?(?>\s+of)?(?>(?:\s+(?:professional|relevant|industry|work|hands-on|total|overall|full-time)(?:\s*,)?)*)\s+experience\b(?!\s+(?:with|in|using|of|on|building|developing|designing|as|leading|managing|supporting)\b))'
        subject_suppressors: [*company_side_years]
      - id: range_years_preferred
        requiredness: preferred
        implies: range_years_preferred
        scope: sentence
        capture: years
        requirement_text: "{years} years of total experience is preferred"
        pattern: '(?:\b(?P<years>\d{1,2})\s*(?:[-–—]|\s+to\s+)\s*\d{1,2}\s*\+?\s*(?:years?|yrs?)(?!\w)\.?(?>\s+of)?(?>(?:\s+(?:professional|relevant|industry|work|hands-on|total|overall|full-time)(?:\s*,)?)*)\s+experience\b(?!\s+(?:with|in|using|of|on|building|developing|designing|as|leading|managing|supporting)\b)[^.]{0,25}?(?:preferred|desirable|a\s+plus|nice\s+to\s+have|bonus|advantageous|desired\b(?!\s+(?:candidate|applicant|profile|skill|qualification|attribute|trait|background|characteristic|competenc|experience|expertise)\w*))|(?:nice\s+to\s+have|ideally|preferred|desirable|bonus|advantageous|desired\b(?!\s+(?:candidate|applicant|profile|skill|qualification|attribute|trait|background|characteristic|competenc|experience|expertise)\w*)|we\s+(?:would\s+)?prefer|preference\s+for)\s*[:,]?\s*(?:(?:at\s+least|a\s+minimum\s+of|minimum\s+of)\s+)?\b(?P<years_alt>\d{1,2})\s*(?:[-–—]|\s+to\s+)\s*\d{1,2}\s*\+?\s*(?:years?|yrs?)(?!\w)\.?(?>\s+of)?(?>(?:\s+(?:professional|relevant|industry|work|hands-on|total|overall|full-time)(?:\s*,)?)*)\s+experience\b(?!\s+(?:with|in|using|of|on|building|developing|designing|as|leading|managing|supporting)\b))'
        subject_suppressors: [*company_side_years]

  - id: clearance
    label: Security clearance
    tier: profile
    fact: security_clearance
    answer_type: structured
    default_policy: preference
    question: "What security clearance do you currently hold, if any?"
    fields:
      - name: scheme
        type: choice
        choices: [us_dod, us_doe, us_public_trust, other, unspecified]
      - name: level
        type: choice
        choices: [none, public_trust, confidential, secret, top_secret, q, l, unspecified]
      - name: state
        type: choice
        choices: [none, active, current, expired, interim, unspecified]
      - name: accesses
        type: choice_set
        choices: [sci, poly, sap, nato]
      # Obtain-after-hire eligibility, which no combination of the four fields above can
      # answer: `clearable_required` postings ask whether the candidate could be cleared,
      # not what they hold today. A bool rather than a choice because it has exactly two
      # answers and the third state -- undeclared -- is the absent value, which abstains.
      - name: obtainable
        type: bool
    implies_vocabulary:
      - active_clearance_required
      - clearable_required
      - clearance_preferred
    exclusive_groups:
      - [active_clearance_required, clearable_required]
    # Reviewed superset relations. NOT a general order: each row is an explicit,
    # scheme-local statement that holding the left satisfies the right.
    superset_relations:
      - {holds_level: top_secret, satisfies_level: secret, scheme: us_dod}
      - {holds_level: top_secret, satisfies_level: confidential, scheme: us_dod}
      - {holds_level: secret, satisfies_level: confidential, scheme: us_dod}
    patterns:
      # CANONICAL MARKER VOCABULARY, converged across the family (parity table, the
      # finding-74 class). Findings 66/68/69/83/84/86/87/88/89/102/103 were all one marker
      # token in one position in one family, found and patched one at a time. The two groups
      # below are the whole vocabulary, and every pattern in this family carries BOTH,
      # character for character, so a token can never again be present on one level and
      # absent on its sibling. Grep for either group before editing: they move in lockstep.
      #
      #   marker-LAST  (after a copula, or bare with no copula)
      #     required | mandatory | needed | compulsory | non-negotiable | a must
      #     | a requirement | necessary | essential
      #   marker-FIRST (verb phrase before the subject, direct-object arm)
      #     must hold/possess/have/maintain | must be in possession of | will need
      #     | need(s) | are/is/be required to have/hold/possess/maintain
      #     ... plus require(s|d) on the separate `requires <subject>` arm.
      #
      # `must be` has no nominal frame here -- it takes a predicate adjective ("must be
      # cleared"), not a clearance noun -- so the only surface it contributes is
      # `must be in possession of`. `need` is safe on the direct-object arm because that arm
      # has NO gap; it is deliberately absent from the `with|w/` arm, whose 40-character gap
      # would read "Experience with polygraph tooling" as a polygraph gate.
      # Every leveled pattern below carries a requirement MARKER, reached through a bounded
      # clause-internal gap. Without a marker they fired on company-side and environmental
      # prose: "Work is performed at our facility, which holds an active Secret clearance."
      # and "You will work in an active TS/SCI environment alongside cleared teammates." both
      # returned `ineligible` to an uncleared candidate. The gap is what lint rule 1 warns
      # about, and it is safe here only because the cue-inside guard now DROPS any detection
      # with an undeclared negation cue in its span: "An active TS/SCI clearance is not
      # required." reaches the marker through the gap and is dropped for containing `not`.
      # The subject suppressor is UNIT-scoped, never document-scoped: a facility sentence
      # says nothing about the requirement two sentences later.
      # A polygraph requirement is its own row rather than a variant of every level
      # pattern. Coupling it by adjacency failed on "TS/SCI clearance with a current
      # polygraph", where the word "clearance" sits between the two, and a TS/SCI holder
      # without a polygraph was told `met` on a poly-gated role.
      - id: polygraph_required
        requiredness: required
        implies: active_clearance_required
        scope: clause
        required_scheme: unspecified
        required_level: unspecified
        required_accesses: [poly]
        requirement_text: "A current polygraph is required"
        # The bare "with a polygraph" form now needs a marker BEFORE it. Unanchored it fired
        # on "Experience with polygraph examination tooling is a plus." and told a candidate
        # with no clearance they were ineligible for a role that asked for nothing.
        pattern: '(?:current|active|recent)?\s*(?:CI|FS|full[\s-]?scope)?\s*poly(?:graph)?(?:\s+examination)?\s*(?:is\s+|will\s+be\s+)?(?:required|mandatory|needed|compulsory|non[\s-]?negotiable|a\s+must(?:\s*-?\s*have)?|a\s+requirement|(?<!\bas\s)(?<!\bif\s)(?<!when\s)(?<!ever\s)(?<!where\s)(?<!unless\s)(?<!deemed\s)(?<!\bonly\s)(?:necessary|essential))|(?<!which\s)(?<!that\s)(?:require[sd]?|must\s+(?:hold|possess|have))(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)[^.;:]){0,40}?(?:with|w/)\s+(?:an?\s+)?(?:current\s+|active\s+|recent\s+)?(?:CI\s+|FS\s+|full[\s-]?scope\s+)?poly(?:graph)?(?!\w)|(?:must\s+(?:currently\s+)?(?:hold|possess|have|maintain)(?:\s+and\s+maintain)?|must\s+be\s+in\s+possession\s+of|will\s+need|needs?|(?:are|is|be)\s+required\s+to\s+(?:have|hold|possess|maintain))\s+(?:an?\s+)?(?:current\s+|active\s+|recent\s+)?(?:CI\s+|FS\s+|full[\s-]?scope\s+)?poly(?:graph)?(?!\w)|(?<!which\s)(?<!that\s)requires?\s+(?:(?:an?|the)\s+|(?=(?:active|current)\s))(?:current\s+|active\s+|recent\s+)?(?:CI\s+|FS\s+|full[\s-]?scope\s+)?poly(?:graph)?(?!\w)(?=\s*[.;:,)]|\s*$|\s+(?:is|are|was|were|and|or|at|for|in|on|by|with|from|prior|before|upon|within|to|through)\b)'
        subject_suppressors: &company_side_clearance
          - "we\\s+(?:will\\s+)?sponsor|you\\s+will\\s+work\\s+(?:in|at)|(?:our|the)\\s+(?:\\w+\\s+){0,2}(?:facility|site|office|contract\\s+vehicle)"
      # Special Access Program and NATO were declared FACT values that no pattern could ever
      # require, so "Active TS/SCI clearance with SAP access is required." told a TS/SCI
      # holder WITHOUT SAP that they were eligible. The bare token is deliberately not
      # enough: SAP is also an ERP vendor, so the span must pair it with a clearance context
      # and a marker.
      - id: sap_access_required
        requiredness: required
        implies: active_clearance_required
        scope: clause
        required_scheme: unspecified
        required_level: unspecified
        required_accesses: [sap]
        requirement_text: "Special Access Program access is required"
        pattern: '(?:clearance|S\.?C\.?I\.?(?!\w)|Special\s+Access\s+Program)(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice)\b)[^.;:]){0,30}?(?:with\s+)?(?<!\w)S\.?A\.?P\.?(?!\w)\s+(?:program\s+)?access(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice)\b)[^.;:]){0,40}?(?:is\s+|will\s+be\s+)?(?:required|mandatory|needed|compulsory|non[\s-]?negotiable|a\s+must(?:\s*-?\s*have)?|a\s+requirement|(?<!\bas\s)(?<!\bif\s)(?<!when\s)(?<!ever\s)(?<!where\s)(?<!unless\s)(?<!deemed\s)(?<!\bonly\s)(?:necessary|essential))'
        subject_suppressors: *company_side_clearance
      - id: nato_access_required
        requiredness: required
        implies: active_clearance_required
        scope: clause
        required_scheme: unspecified
        required_level: unspecified
        required_accesses: [nato]
        requirement_text: "A NATO clearance is required"
        pattern: '(?:(?:active|current)\s+)?NATO\s+(?:Secret\s+|Confidential\s+)?(?:security\s+)?(?:clearance|access)(?!\s+(?:program|programs|processing|process|investigation|investigations|renewal|renewals|briefing|briefings|upgrade|upgrades|experience|work|holders?|tooling|systems?|team|teams|support|documentation|paperwork|sponsorship|reimbursement|facility|facilities|site|sites|environment|environments|office|offices|location|locations|campus|campuses)\b)(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice)\b)[^.;:]){0,40}?(?:is\s+|will\s+be\s+)?(?:required|mandatory|needed|compulsory|non[\s-]?negotiable|a\s+must(?:\s*-?\s*have)?|a\s+requirement|(?<!\bas\s)(?<!\bif\s)(?<!when\s)(?<!ever\s)(?<!where\s)(?<!unless\s)(?<!deemed\s)(?<!\bonly\s)(?:necessary|essential))|(?:must\s+(?:currently\s+)?(?:hold|possess|have|maintain)(?:\s+and\s+maintain)?|must\s+be\s+in\s+possession\s+of|will\s+need|needs?|(?:are|is|be)\s+required\s+to\s+(?:have|hold|possess|maintain))\s+(?:an?\s+)?(?:(?:active|current)\s+)?NATO\s+(?:Secret\s+|Confidential\s+)?(?:security\s+)?(?:clearance|access)|(?<!which\s)(?<!that\s)requires?\s+(?:(?:an?|the)\s+|(?=(?:active|current)\s))(?:(?:active|current)\s+)?NATO\s+(?:Secret\s+|Confidential\s+)?(?:security\s+)?(?:clearance|access)(?=\s*[.;:,)]|\s*$|\s+(?:is|are|was|were|and|or|at|for|in|on|by|with|from|prior|before|upon|within|to|through)\b)|(?<!which\s)(?<!that\s)(?:require[sd]?|must\s+(?:hold|possess|have))(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)[^.;:]){0,40}?(?:with|w/)\s+(?:(?:an?|the)\s+|(?=(?:active|current)\s))(?:(?:active|current)\s+)?NATO\s+(?:Secret\s+|Confidential\s+)?(?:security\s+)?(?:clearance|access)(?=\s*[.;:,)]|\s*$|\s+(?:is|are|was|were|and|or|at|for|in|on|by|with|from|prior|before|upon|within|to|through)\b)'
        subject_suppressors: *company_side_clearance
      - id: active_ts_sci_required
        requiredness: required
        implies: active_clearance_required
