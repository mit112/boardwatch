  - id: degree
    label: Degree
    tier: profile
    fact: highest_degree
    answer_type: choice
    default_policy: preference
    question: "What is the highest degree you have completed?"
    fields:
      - name: highest_degree
        type: choice
        choices: [none, associate, bachelor, master, doctorate, prefer_not_to_say]
        ranks: {none: 0, associate: 2, bachelor: 3, master: 4, doctorate: 5}
    implies_vocabulary:
      - degree_required
      - degree_required_with_field
      - degree_required_or_equivalent
      - degree_preferred
      - degree_preferred_or_equivalent
    exclusive_groups:
      - [degree_required, degree_required_with_field, degree_required_or_equivalent]
    # THE CANONICAL REQUIREMENT-MARKER VOCABULARY, declared once here and written out verbatim
    # on each of the SEVEN marker-carrying patterns below. Findings 115-124 closed this as a
    # class after finding 102 closed one token of it by hand; parity.py measured ELEVEN missing
    # markers on the degree rows against the sibling families that carried them.
    #   marker-LAST, which the optional copula makes one arm for both the bare and copular
    #     forms ("Degree necessary." / "A degree is necessary."):
    #       (?:is\s+)?(?:required|mandatory|necessary|essential|compulsory|needed
    #                   |a\s+must|a\s+requirement|non-negotiable)(?!\w)
    #   marker-FIRST, the verb phrase before the subject:
    #       (?:require[sd]?(?:\s+to\s+(?:have|hold|possess))?
    #          |must\s+(?:have|hold|possess|be)|(?:will\s+)?needs?)
    # The `(?!\w)` tail is load-bearing, not decoration: without it `essential` matches inside
    # `essentially` and `necessary` inside `necessarily`, so "A degree is essentially a filter."
    # read as a hard requirement. The `\s+to\s+(?:have|hold|possess)` bridge exists because
    # `require[sd]?` alone reached the LEVELED patterns through their bounded `{0,20}` gap while
    # any_degree_required and the three in-field patterns have no gap and were stranded on
    # "You are required to have a degree."
    # WHY IT IS REPEATED rather than aliased: a YAML anchor substitutes a whole NODE and
    # `pattern:` is one scalar, so an alias cannot reach inside a regex, and the loader does no
    # interpolation (`re.compile(p["pattern"])`, verbatim). Same situation as the jurisdiction
    # list, which is likewise written out twice in the sponsorship patterns. Drift is caught
    # behaviourally, not by this comment: every token is pinned at every level in matrix.py, so
    # dropping one from a single pattern fails a case.
    # The other six patterns carry NO marker by design. The three *_or_equivalent patterns key
    # on the equivalence escape and the three preferred patterns key on the hedge, so there is
    # nothing here for them to lack.
    patterns:
      - id: doctorate_required
        requiredness: required
        implies: degree_required
        scope: sentence
        required_rank: 5
        requirement_text: "A doctorate is required"
        pattern: '(?:(?P<coord_rank4_a>Master[''’‘]?s?|(?<![\w.])M\.?S\.?(?!\w)|(?<![\w.])M\.?Sc\.?(?!\w)|(?<![\w.])M\.?Eng\.?(?!\w)|(?<![\w.])M\.?B\.?A\.?(?!\w))\s*(?:degree)?\s*(?:,\s*)?(?:or|/)\s*)?(?:Ph\.?D\.?|Doctorate|Doctoral\s+degree|Doctor\s+of\s+(?:Philosophy|Science|Engineering))(?:\s*(?:,\s*)?(?:or|/)\s*(?P<coord_rank4_b>Master[''’‘]?s?|(?<![\w.])M\.?S\.?(?!\w)|(?<![\w.])M\.?Sc\.?(?!\w)|(?<![\w.])M\.?Eng\.?(?!\w)|(?<![\w.])M\.?B\.?A\.?(?!\w))\s*(?:degree)?)?\s*(?:degree\s*)?(?:is\s+)?(?:required|mandatory|necessary|essential|compulsory|needed|a\s+must|a\s+requirement|non-negotiable)(?!\w)|(?:require[sd]?(?:\s+to\s+(?:have|hold|possess))?|must\s+(?:have|hold|possess|be)|(?:will\s+)?needs?|(?<!\w)mandator(?:y|ily)(?!\w))\s*:?\s*(?:at\s+least\s+|a\s+minimum\s+of\s+)?(?:(?:an?\s+)?(?P<coord_rank4_c>Master[''’‘]?s?|(?<![\w.])M\.?S\.?(?!\w)|(?<![\w.])M\.?Sc\.?(?!\w)|(?<![\w.])M\.?Eng\.?(?!\w)|(?<![\w.])M\.?B\.?A\.?(?!\w))\s*(?:degree)?\s*(?:,\s*)?(?:or|/)\s*)?(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)[^.]){0,20}(?:Ph\.?D\.?|Doctorate|Doctoral\s+degree|Doctor\s+of\s+(?:Philosophy|Science|Engineering))(?:\s*(?:,\s*)?(?:or|/)\s*(?P<coord_rank4_d>Master[''’‘]?s?|(?<![\w.])M\.?S\.?(?!\w)|(?<![\w.])M\.?Sc\.?(?!\w)|(?<![\w.])M\.?Eng\.?(?!\w)|(?<![\w.])M\.?B\.?A\.?(?!\w)))?(?![\w-])'
        # THREE ROLES were conflated in one document-scoped suppressed_by list here and on every
        # other plain degree pattern, which is findings 38 and 52. They are separated by role:
        #   an EQUIVALENCE ESCAPE is inherently cross-sentence ("A Master's degree is required.
        #     Equivalent experience may be substituted.") so it stays DOCUMENT-scoped, but it
        #     moves to abstain_by: a suppressor DROPS, and dropping a requirement the posting
        #     merely MIGHT waive returns `eligible` by silence, the worst direction. Abstaining
        #     keeps the row and answers "this may be waived and I cannot tell".
        #   a SPECIFICITY stand-down ("a more specific statement exists") is a claim about THIS
        #     SENTENCE, so it becomes UNIT-scoped. Document-scoped it deleted requirements in
        #     other sentences: "A Bachelor's degree is required. We value a degree in Physics."
        #     dropped BOTH degree rows and told a candidate with no degree they were eligible.
        # `us_citizen_required`'s `or ... permanent resident` escape is deliberately NOT touched:
        # it is correctly document-scoped and correctly a DROP, and both review families audited
        # it and agreed.
        # ITEM anchors, not list anchors: any_degree_required composes the specificity entry with
