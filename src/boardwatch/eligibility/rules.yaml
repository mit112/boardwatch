\w)T\.?S\.?|Top\s+Secret)\s*/\s*S\.?C\.?I\.?(?!\w)(?!\s+(?:facility|facilities|site|environment|program|space|area|room|network|enclave|contract|project|work|sauce)\b)|(?<!which\s)(?<!that\s)requires?\s+(?:(?:an?|the)\s+|(?=(?:active|current)\s))(?:(?:active|current)\s+)?(?:(?:U\.?S\.?\s+)?(?<!\w)(?:DoD|D\.?o\.?D\.?|Department\s+of\s+Defense|government|federal)\s+)?(?:(?<!\w)T\.?S\.?|Top\s+Secret)\s*/\s*S\.?C\.?I\.?(?!\w)\s+(?:security\s+)?clearance(?=\s*[.;:,)]|\s*$|\s+(?:is|are|was|were|and|or|at|for|in|on|by|with|from|prior|before|upon|within|to|through)\b)|(?<!which\s)(?<!that\s)(?:require[sd]?|must\s+(?:hold|possess|have))(?:(?!\b(?:and|but|while|whereas|preferred|desirable|ideally|bonus|plus|desired|nice|for|in|of|at|on|from|by|with|as|within|under|across)\b)[^.;:]){0,40}?(?:with|w/)\s+(?:(?:an?|the)\s+|(?=(?:active|current)\s))(?:(?:active|current)\s+)?(?:(?:U\.?S\.?\s+)?(?<!\w)(?:DoD|D\.?o\.?D\.?|Department\s+of\s+Defense|government|federal)\s+)?(?:(?<!\w)T\.?S\.?|Top\s+Secret)\s*/\s*S\.?C\.?I\.?(?!\w)\s+(?:security\s+)?clearance(?=\s*[.;:,)]|\s*$|\s+(?:is|are|was|were|and|or|at|for|in|on|by|with|from|prior|before|upon|within|to|through)\b)'
        subject_suppressors: *company_side_clearance
      - id: active_top_secret_required
        requiredness: required
        implies: active_clearance_required
        scope: clause
        required_scheme: us_dod
        required_level: top_secret
        required_accesses: []
