# Seniority leveling catalog (D-246). Universal tier = the mechanism; field tier = meanings.
#
# THIS FILE CONTAINS NO COMPANY NAMES, deliberately. A company's leveling scheme is not a
# fact boardwatch can ship — the board list is per-operator — so the company -> scheme
# binding lives in {config_dir}/leveling-bindings.yaml. An unbound level ABSTAINS.
leveling_version: 1

# Which token shapes are levels at all. Measured 2026-08-19 over 26,997 open postings.
grammars:
  # "Level 5" names itself. All 33 live hits are genuine levels.
  level_n: {kind: self_describing}
  # Bare letter+digit is usually NOT a level: of 45 live `L#` hits, most are OSI layer 2,
  # support tiers, or facility codes. These never resolve, whatever the binding says.
  l_prefix: {kind: ambiguous}
  e_prefix: {kind: ambiguous}
  ic_prefix: {kind: ambiguous}
  t_prefix: {kind: ambiguous}

# Named, company-free rung ladders. An operator binds a company to one of these by name.
schemes:
  ic_1_to_7:
    grammar: level_n
    levels: {"1": entry, "2": entry, "3": entry, "4": mid,
             "5": senior, "6": staff_plus, "7": staff_plus}
  ic_1_to_6:
    grammar: level_n
    levels: {"1": entry, "2": entry, "3": mid, "4": senior,
             "5": staff_plus, "6": staff_plus}

# Field tier: what the WORDS mean. An unresolvable career field abstains rather than
# defaulting to software, because these invert by field (a postdoc Fellow is entry-level).
fields:
  software:
    words:
      senior: senior
      "sr": senior
      lead: senior
      leader: senior          # required: `Lead` is a substring of `Leader`
      manager: senior
      staff: staff_plus
      principal: staff_plus
      distinguished: staff_plus
      director: staff_plus
      "vp": staff_plus
      "vice president": staff_plus
      "head of": staff_plus   # dormant: 0 hits measured 2026-08-19
      chief: staff_plus       # dormant: 0 hits measured 2026-08-19
    roman: {"II": mid, "III": senior, "IV": senior}
    # Titles that state they are entry-level in so many words. These never decide a band — an
    # absent seniority word already reads `entry` — they RANK: for a profile targeting `entry`,
    # a software title carrying one sorts ahead of every other tier (`top_cmd._rank_tier`).
    # Matched case-insensitively on whole words, with any dash read as a space.
    entry_markers: ["new grad", "new grads", "new graduate", "new graduates", "new college grad",
                    "new college graduate", "university grad", "university graduate",
                    "recent grad", "recent graduate", "early career", "early careers",
                    "entry level", "junior", "engineer i", "engineer 1", "developer i",
                    "developer 1", "sde i", "sde 1", "swe i", "swe 1",
                    # Measured 2026-09-26 on 4,275 visible in_field postings: these mark 130 more,
                    # every one a graduate/campus-hire role (the only flagged ones are PhD new-grad
                    # roles). Store-wide they also mark 46 internships, which a profile's own
                    # exclude titles hide. "Graduate Research Assistant" is not in_field, so tier
                    # 0 never sees it. "associate" is absent: it names a mid rung at many firms.
                    "college grad", "college graduate", "campus", "2026 start", "2027 start",
                    "graduate"]
    # JD-body sentences that state the role is entry-level, for a posting whose title does not.
    # Same use and matching as `entry_markers`, per sentence, with every dash read as a space
    # (so "0 2 years" matches "0-2 years" and "0–2 years"). A sentence that also names an
    # exclusion is not a hit: "0-2 years for junior, 5+ for senior" hires across levels, and
    # "mentor early career engineers" is a senior role's duty.
    # Bare "entry level" and "graduation date" are deliberately absent — both read in EEO and
    # benefits boilerplate far more often than in a requirement — and so is "expected graduation
    # date": measured 2026-09-26, once the vetoes below drop internships it lifts 2 postings
    # store-wide, both for enrolled students.
    entry_body_markers: ["0 1 years", "0 to 1 years", "0 2 years", "0 to 2 years",
                         "new grad", "new grads", "new graduate", "new graduates",
                         "new college grad", "new college graduate", "recent grad",
                         "recent grads", "recent graduate", "recent graduates", "early career",
                         "class of 2026", "class of 2027"]
    entry_body_exclusions: ["across levels", "varying levels", "senior", "staff", "experts",
                            "or experienced", "or an experienced", "and experienced",
                            "whether you", "not intended", "mentor", "mentoring", "seasoned",
                            "no new grads", "separate"]
    # A title naming one of these earns tier 0 through NO marker, title or body: an internship,
    # co-op or working-student post is a student role, and "Graduate Intern" or a body's "recent
    # graduates" does not make it a new-grad one. Whole words, so "Internal Tools" is not vetoed.
    # Measured 2026-09-26: they veto 97 title-marked and 60 body-marked open in_field postings.
    entry_marker_vetoes: ["intern", "interns", "internship", "internships", "co-op", "co-ops",
                          "coop", "student", "students"]
