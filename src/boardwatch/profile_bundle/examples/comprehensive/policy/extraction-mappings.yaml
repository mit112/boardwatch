'mappings_version': 1
'adapters':
- 'adapter_id': 'boardwatch-resume-v1'
  'literal_rules':
  - 'locator_pattern': 'header/1'
    'predicate': 'person.professional_name'
    'value_from': '.'
    'value_type': 'string'
    'display_from': '.'
  - 'locator_pattern': 'skill-groups/*/*'
    'predicate': 'technology.used'
    'value_from': 'item'
    'value_type': 'skill_ref'
    'display_from': 'item'
  'model_routed_rules':
  - 'locator_pattern': 'entries/*/metadata'
    'kind_source': 'self'
    'emits_group': 'metadata'
  - 'locator_pattern': 'entries/*/bullets/*'
    'kind_source': 'condition'
    'emits_group': 'contribution'
  'entry_kind_model':
  - 'kind': 'experience'
    'subject_kind': 'employment'
    'slots':
    - 'group': 'metadata'
      'value_from': 'heading'
      'value_type': 'string'
      'predicate': 'employment.organization'
      'display_from': 'heading'
      'value_selector': null
    - 'group': 'metadata'
      'value_from': 'title'
      'value_type': 'string'
      'predicate': 'employment.title'
      'display_from': 'title'
      'value_selector': null
    - 'group': 'metadata'
      'value_from': 'dates'
      'value_type': 'date_range'
      'predicate': 'employment.date_range'
      'display_from': 'dates'
      'value_selector': null
    - 'group': 'metadata'
      'value_from': 'location'
      'value_type': 'string'
      'predicate': 'entity.location'
      'display_from': 'location'
      'value_selector': null
    - 'group': 'contribution'
      'value_from': 'text'
      'value_type': 'string'
      'predicate': 'employment.accomplishment'
      'display_from': 'text'
      'value_selector': null
  - 'kind': 'project'
    'subject_kind': 'project'
    'slots':
    - 'group': 'metadata'
      'value_from':
      - 'title'
      - 'heading'
      'value_type': 'string'
      'predicate': 'project.name'
      'display_from': 'chosen'
      'value_selector': null
    - 'group': 'metadata'
      'value_from': 'dates'
      'value_type': 'year_month'
      'predicate': 'project.start_date'
      'display_from': 'dates'
      'value_selector': 'range_start'
    - 'group': 'metadata'
      'value_from': 'dates'
      'value_type': 'year_month'
      'predicate': 'project.end_date'
      'display_from': 'dates'
      'value_selector': 'range_end'
    - 'group': 'metadata'
      'value_from': 'location'
      'value_type': 'string'
      'predicate': 'entity.location'
      'display_from': 'location'
      'value_selector': null
    - 'group': 'contribution'
      'value_from': 'text'
      'value_type': 'string'
      'predicate': 'project.contribution'
      'display_from': 'text'
      'value_selector': null
  'deferrals':
  - 'locator_pattern': 'header/2'
    'reason': 'no_predicate_exists'
  - 'locator_pattern': 'education/*'
    'reason': 'free_text_deferred'
