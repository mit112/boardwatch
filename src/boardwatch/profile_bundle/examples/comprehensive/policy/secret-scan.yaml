ruleset_version: 1
rules:
- rule_id: private-key-block
  pattern: '-----BEGIN[ \t]+(?:OPENSSH[ \t]+|RSA[ \t]+|EC[ \t]+|DSA[ \t]+|PGP[ \t]+)?PRIVATE[ \t]+KEY(?:[
    \t]+BLOCK)?-----'
  flags: []
- rule_id: authorization-header
  pattern: ^[ \t]*authorization[ \t]*:[ \t]*(?:bearer|basic)[ \t]+[A-Za-z0-9._~+/=-]{8,}[ \t]*$
  flags:
  - ignore_case
  - multiline
- rule_id: cookie-header
  pattern: ^[ \t]*(?:cookie|set-cookie)[ \t]*:[^\r\n]{8,}$
  flags:
  - ignore_case
  - multiline
- rule_id: credential-url
  pattern: \b[a-z][a-z0-9+.-]*://[^/\s:@]+:[^/\s@]{4,}@
  flags:
  - ignore_case
- rule_id: generic-secret-assignment
  pattern: \b(?:api[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret|password|private[_-]?key)\b[
    \t]{0,8}(?::|=)[ \t]{0,8}["']?[A-Za-z0-9._~+/=-]{8,}
  flags:
  - ignore_case
- rule_id: aws-access-key-id
  pattern: \b(?:AKIA|ASIA)[A-Z0-9]{16}\b
  flags: []
- rule_id: github-token
  pattern: \b(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{82,255})\b
  flags: []
- rule_id: slack-token
  pattern: \bxox[baprs]-[A-Za-z0-9-]{10,255}\b
  flags: []
